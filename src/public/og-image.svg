<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep instrument-panel background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <radialGradient id="glow" cx="30%" cy="-5%" r="85%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Title gradient: blue → indigo -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="#3b82f6" opacity="0.9"/>

  <!-- Kicker pill -->
  <g transform="translate(80, 92)">
    <rect x="0" y="0" width="332" height="40" rx="20" fill="#3b82f6" fill-opacity="0.13" stroke="#60a5fa" stroke-opacity="0.45"/>
    <circle cx="24" cy="20" r="5" fill="#60a5fa"/>
    <text x="42" y="26" font-family="'IBM Plex Mono'" font-weight="600" font-size="17" letter-spacing="2" fill="#93c5fd">IN-MEMORY SEARCH ENGINE</text>
  </g>

  <!-- Title (Orbitron wordmark) -->
  <text x="78" y="240" font-family="'Orbitron'" font-weight="800" font-size="92" letter-spacing="4" fill="url(#title)">MygramDB</text>

  <!-- Tagline -->
  <text x="82" y="306" font-family="'IBM Plex Sans'" font-weight="500" font-size="34" fill="#c3d2ea">Sub-millisecond full-text search, synced over MySQL binlog</text>

  <!-- Latency readout strip -->
  <g transform="translate(80, 392)">
    <text x="0" y="14" font-family="'IBM Plex Sans'" font-weight="500" font-size="20" fill="#9fb0cc">MySQL FULLTEXT</text>
    <rect x="250" y="0" width="560" height="18" rx="9" fill="#f43f5e" fill-opacity="0.85"/>
    <text x="826" y="15" font-family="'IBM Plex Mono'" font-weight="600" font-size="22" fill="#fb7185">2,566ms</text>

    <text x="0" y="62" font-family="'IBM Plex Sans'" font-weight="500" font-size="20" fill="#9fb0cc">MygramDB</text>
    <rect x="250" y="48" width="26" height="18" rx="9" fill="#60a5fa"/>
    <text x="290" y="63" font-family="'IBM Plex Mono'" font-weight="600" font-size="22" fill="#93c5fd">0.08ms</text>

    <g transform="translate(960, 8)">
      <rect x="0" y="0" width="160" height="48" rx="24" fill="#3b82f6" fill-opacity="0.15" stroke="#60a5fa" stroke-opacity="0.4"/>
      <text x="80" y="32" text-anchor="middle" font-family="'IBM Plex Mono'" font-weight="700" font-size="25" fill="#93c5fd">27,600×</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 560)">
    <g transform="scale(0.34)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z" fill="#6478a0"/>
    </g>
    <text x="48" y="26" font-family="'IBM Plex Mono'" font-weight="500" font-size="24" fill="#8a9bbd">github.com/libraz/mygram-db</text>
  </g>
  <text x="1140" y="586" text-anchor="end" font-family="'IBM Plex Mono'" font-weight="500" font-size="20" fill="#5d6e91">MIT &#183; single binary &#183; MySQL &amp; MariaDB</text>
</svg>
