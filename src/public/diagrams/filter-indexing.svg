<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
  <title id="title">Required filters and search-time filters</title>
  <desc id="desc">Required filters decide whether rows enter the index. Search-time filters narrow already indexed rows at query time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .gate{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .idx{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .query{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
      .drop{fill:#ffe4e6;stroke:#be123c;stroke-width:2}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1040" height="470" rx="18"/>
  <rect class="box" x="40" y="80" width="190" height="210" rx="10"/>
  <text class="title" x="135" y="121" text-anchor="middle">MySQL rows</text>
  <text class="text" x="135" y="158" text-anchor="middle">id, text</text>
  <text class="text" x="135" y="184" text-anchor="middle">enabled</text>
  <text class="text" x="135" y="210" text-anchor="middle">deleted_at</text>
  <text class="text" x="135" y="236" text-anchor="middle">status, category</text>

  <polygon class="gate" points="395,90 535,185 395,280 255,185"/>
  <text class="title" x="395" y="162" text-anchor="middle">required_filters</text>
  <text class="small" x="395" y="187" text-anchor="middle">index only rows that match</text>
  <text class="small" x="395" y="211" text-anchor="middle">example: deleted_at IS NULL</text>
  <text class="small" x="395" y="235" text-anchor="middle">AND enabled=1</text>

  <rect class="idx" x="560" y="80" width="190" height="210" rx="10"/>
  <text class="title" x="655" y="122" text-anchor="middle">Index</text>
  <text class="text" x="655" y="160" text-anchor="middle">n-gram posting lists</text>
  <text class="text" x="655" y="188" text-anchor="middle">DocStore</text>
  <text class="text" x="655" y="216" text-anchor="middle">filter values</text>
  <text class="small" x="655" y="248" text-anchor="middle">only eligible rows are present</text>

  <rect class="query" x="820" y="80" width="180" height="210" rx="10"/>
  <text class="title" x="910" y="122" text-anchor="middle">Query</text>
  <text class="text" x="910" y="160" text-anchor="middle">SEARCH ...</text>
  <text class="text" x="910" y="188" text-anchor="middle">FILTER status=1</text>
  <text class="text" x="910" y="216" text-anchor="middle">FILTER category=tech</text>
  <text class="small" x="910" y="248" text-anchor="middle">narrows indexed rows</text>

  <rect class="drop" x="300" y="335" width="270" height="68" rx="10"/>
  <text class="text" x="435" y="363" text-anchor="middle">Rows that fail required_filters</text>
  <text class="small" x="435" y="387" text-anchor="middle">never enter search results until an UPDATE makes them eligible</text>

  <path class="line" d="M230 185 L255 185"/>
  <path class="line" d="M535 185 L560 185"/>
  <path class="line" d="M750 185 L820 185"/>
  <path class="line" d="M395 280 C395 310 420 318 435 335"/>
  <text class="small" x="783" y="167" text-anchor="middle">filters</text>
</svg>
