<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Consistent snapshot to binlog handoff</title>
  <desc id="desc">At t0 a consistent-snapshot transaction freezes a view and captures gtid_executed as N; table data is read entirely inside that frozen transaction while application writes keep accumulating in the binlog as transactions N+1 through M, and binlog streaming then resumes at exactly N+1 so every transaction partitions cleanly at N with no gap and no double-apply.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .axis{fill:none;stroke:#334155;stroke-width:3}
      .stream{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .tick{stroke:#334155;stroke-width:2}
      .guide{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}
      .amber{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .green{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .gseq{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect class="bg" width="1120" height="480" rx="18"/>

  <!-- t0 snapshot callout -->
  <rect class="amber" x="70" y="26" width="560" height="62" rx="10"/>
  <text class="text" x="350" y="52" text-anchor="middle">START TRANSACTION WITH CONSISTENT SNAPSHOT</text>
  <text class="small" x="350" y="74" text-anchor="middle">gtid_executed captured = N   (this instant is t0)</text>

  <!-- green handoff badge -->
  <rect class="green" x="655" y="74" width="210" height="40" rx="20"/>
  <text class="text" x="760" y="100" text-anchor="middle" fill="#15803d">no gap, no double-apply</text>

  <!-- vertical guides at t0 and t1 -->
  <line class="guide" x1="350" y1="90" x2="350" y2="360"/>
  <line class="guide" x1="760" y1="116" x2="760" y2="360"/>

  <!-- sky span: writes continue (above axis) -->
  <rect x="350" y="116" width="650" height="84" rx="8" fill="#e0f2fe" fill-opacity="0.5" stroke="#0369a1" stroke-width="2"/>
  <text class="text" x="675" y="150" text-anchor="middle">application writes continue</text>
  <text class="small" x="675" y="176" text-anchor="middle">transactions N+1 … M accumulate in the binlog, then more in real time</text>

  <!-- time axis: gray up to t1, brand-blue streaming arrow after -->
  <line class="axis" x1="90" y1="250" x2="760" y2="250"/>
  <line class="stream" x1="760" y1="250" x2="1040" y2="250"/>

  <!-- ticks and GTID sequence labels -->
  <line class="tick" x1="190" y1="243" x2="190" y2="257"/>
  <text class="gseq" x="190" y="235" text-anchor="middle">N-2</text>
  <line class="tick" x1="270" y1="243" x2="270" y2="257"/>
  <text class="gseq" x="270" y="235" text-anchor="middle">N-1</text>
  <line class="tick" x1="470" y1="243" x2="470" y2="257"/>
  <text class="gseq" x="470" y="235" text-anchor="middle">N+1</text>
  <line class="tick" x1="580" y1="243" x2="580" y2="257"/>
  <text class="gseq" x="580" y="235" text-anchor="middle">…</text>
  <line class="tick" x1="760" y1="243" x2="760" y2="257"/>
  <text class="gseq" x="760" y="235" text-anchor="middle">M</text>
  <text class="gseq" x="930" y="235" text-anchor="middle">real time →</text>

  <!-- amber diamond marker at t0 (captured GTID = N) -->
  <polygon points="350,230 370,250 350,270 330,250" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text class="gseq" x="350" y="290" text-anchor="middle" fill="#b45309" font-weight="700">t0 = N</text>

  <!-- brand-blue span: frozen read (below axis) -->
  <rect x="350" y="298" width="410" height="82" rx="8" fill="#dbeafe" fill-opacity="0.5" stroke="#1d4ed8" stroke-width="2"/>
  <text class="text" x="555" y="332" text-anchor="middle">table data read inside the snapshot</text>
  <text class="text" x="555" y="356" text-anchor="middle">transaction — frozen view at N</text>

  <!-- streaming resume label (below axis, right of t1) -->
  <text class="text" x="895" y="306" text-anchor="middle" fill="#1d4ed8">binlog streaming starts at N+1</text>
  <text class="small" x="895" y="329" text-anchor="middle">catches up to M, then follows in real time</text>

  <!-- footer conclusion -->
  <text class="small" x="560" y="458" text-anchor="middle">Every transaction ≤ N is in the snapshot; every transaction &gt; N arrives via the binlog — the two sets partition exactly at the captured GTID.</text>
</svg>
