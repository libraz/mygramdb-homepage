<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="560" viewBox="0 0 1150 560" role="img" aria-labelledby="title desc">
  <title id="title">Reconnect validation and replication halts</title>
  <desc id="desc">After a connection loss and reconnect, MygramDB validates the replica: a disabled GTID mode or missing configured tables halt replication for manual intervention, while a changed server UUID only logs a failover warning and resumes streaming from the saved GTID.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#be123c"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .sb{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
      .slate{fill:#f1f5f9;stroke:#475569;stroke-width:2}
      .gate{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .green{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .rose{fill:#ffe4e6;stroke:#be123c;stroke-width:2}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .stop{font:700 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#be123c}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#334155;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .rline{fill:none;stroke:#be123c;stroke-width:3;marker-end:url(#arrow-rose)}
    </style>
  </defs>
  <rect class="bg" width="1150" height="560" rx="18"/>

  <text class="small" x="610" y="32" text-anchor="middle">both outcomes resume the streaming loop</text>

  <!-- start / streaming state -->
  <text class="small" x="145" y="60" text-anchor="middle">start state</text>
  <rect class="sb" x="40" y="70" width="210" height="76" rx="10"/>
  <text class="title" x="145" y="101" text-anchor="middle">streaming</text>
  <text class="text" x="145" y="126" text-anchor="middle">from saved GTID</text>

  <!-- connection lost -->
  <rect class="slate" x="40" y="196" width="210" height="58" rx="8"/>
  <text class="text" x="145" y="231" text-anchor="middle">connection lost</text>

  <!-- reconnect -->
  <rect class="slate" x="40" y="300" width="240" height="90" rx="8"/>
  <text class="text" x="160" y="332" text-anchor="middle">reconnect with</text>
  <text class="text" x="160" y="356" text-anchor="middle">exponential backoff</text>
  <text class="small" x="160" y="380" text-anchor="middle">(500 ms &#8211; 10 s)</text>
  <path class="dash" d="M110 390 C95 426 225 426 210 390"/>
  <text class="small" x="160" y="424" text-anchor="middle">retry</text>

  <!-- left column transitions -->
  <path class="rline" d="M145 146 L145 196"/>
  <text class="small" x="212" y="176" text-anchor="middle">network drop</text>
  <path class="line" d="M145 254 L150 300"/>
  <path class="line" d="M280 345 C314 345 330 312 330 277"/>
  <text class="small" x="300" y="326" text-anchor="middle">on reconnect</text>

  <!-- validation gates -->
  <polygon class="gate" points="410,215 490,275 410,335 330,275"/>
  <text class="text" x="410" y="270" text-anchor="middle">GTID mode</text>
  <text class="text" x="410" y="290" text-anchor="middle">enabled?</text>

  <polygon class="gate" points="630,215 710,275 630,335 550,275"/>
  <text class="text" x="630" y="270" text-anchor="middle">configured</text>
  <text class="text" x="630" y="290" text-anchor="middle">tables exist?</text>

  <polygon class="gate" points="850,215 930,275 850,335 770,275"/>
  <text class="text" x="850" y="270" text-anchor="middle">same server</text>
  <text class="text" x="850" y="290" text-anchor="middle">UUID?</text>

  <path class="line" d="M490 275 L550 275"/>
  <text class="small" x="520" y="266" text-anchor="middle">yes</text>
  <path class="line" d="M710 275 L770 275"/>
  <text class="small" x="740" y="266" text-anchor="middle">yes</text>

  <!-- no branches to rose terminals -->
  <path class="rline" d="M410 335 L411 405"/>
  <text class="small" x="430" y="374" text-anchor="middle">no</text>
  <path class="rline" d="M630 335 C630 372 652 384 662 405"/>
  <text class="small" x="608" y="374" text-anchor="middle">no</text>

  <rect class="rose" x="298" y="405" width="228" height="104" rx="10"/>
  <text class="stop" x="412" y="440" text-anchor="middle">replication STOPPED</text>
  <text class="small" x="412" y="466" text-anchor="middle">GTID disabled on new server</text>
  <text class="small" x="412" y="488" text-anchor="middle">manual intervention required</text>

  <rect class="rose" x="556" y="405" width="228" height="104" rx="10"/>
  <text class="stop" x="670" y="440" text-anchor="middle">replication STOPPED</text>
  <text class="small" x="670" y="466" text-anchor="middle">configured tables missing</text>
  <text class="small" x="670" y="488" text-anchor="middle">manual intervention required</text>

  <!-- UUID gate outcomes -->
  <path class="line" d="M930 275 C955 275 958 210 958 162"/>
  <text class="small" x="954" y="234" text-anchor="middle">yes</text>
  <path class="line" d="M850 335 C850 375 905 374 958 374"/>
  <text class="small" x="905" y="360" text-anchor="middle">no</text>

  <rect class="green" x="958" y="98" width="182" height="84" rx="10"/>
  <text class="text" x="1049" y="132" text-anchor="middle">resume streaming</text>
  <text class="text" x="1049" y="158" text-anchor="middle">from saved GTID</text>

  <rect class="gate" x="958" y="330" width="182" height="88" rx="10"/>
  <text class="text" x="1049" y="362" text-anchor="middle">continue with</text>
  <text class="text" x="1049" y="386" text-anchor="middle">failover warning</text>
  <text class="small" x="1049" y="408" text-anchor="middle">logged</text>

  <!-- feedback loops back to streaming -->
  <path class="line" d="M1049 98 C1049 40 1049 40 940 40 L200 40 C120 40 100 46 100 70"/>
  <path class="line" d="M1140 374 C1146 374 1146 366 1146 348 L1146 60 C1146 46 1138 48 1118 48 L280 48 C214 48 200 54 200 70"/>

  <text class="small" x="575" y="540" text-anchor="middle">Validation failures that risk data divergence halt replication; a changed server identity only warns.</text>
</svg>
