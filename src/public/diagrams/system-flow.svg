<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">MygramDB system flow</title>
  <desc id="desc">MySQL remains the source of truth, MygramDB reads snapshots and binlog events, keeps an in-memory index, and serves search traffic to applications.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .mysql{fill:#e0f2fe;stroke:#0369a1}
      .mygram{fill:#dbeafe;stroke:#1d4ed8}
      .app{fill:#fff7ed;stroke:#c2410c}
      .store{fill:#f1f5f9;stroke:#475569}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#334155;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="430" rx="18"/>
  <rect class="panel mysql" x="50" y="95" width="230" height="190" rx="10"/>
  <text class="title" x="165" y="140" text-anchor="middle">MySQL / MariaDB</text>
  <text class="text" x="165" y="174" text-anchor="middle">writes and normal SQL</text>
  <text class="text" x="165" y="202" text-anchor="middle">remain here</text>
  <path d="M95 235 h140 a18 18 0 0 1 0 36 h-140 a18 18 0 0 1 0-36z" fill="#bae6fd" stroke="#0369a1"/>
  <text class="small" x="165" y="258" text-anchor="middle">source of truth</text>

  <rect class="panel mygram" x="445" y="48" width="330" height="300" rx="12"/>
  <text class="title" x="610" y="91" text-anchor="middle">MygramDB</text>
  <rect class="store" x="482" y="122" width="256" height="58" rx="8"/>
  <text class="text" x="610" y="147" text-anchor="middle">consistent snapshot / SYNC</text>
  <text class="small" x="610" y="166" text-anchor="middle">initial index build at chosen time</text>
  <rect class="store" x="482" y="196" width="256" height="58" rx="8"/>
  <text class="text" x="610" y="221" text-anchor="middle">binlog reader</text>
  <text class="small" x="610" y="240" text-anchor="middle">INSERT / UPDATE / DELETE events</text>
  <rect class="store" x="482" y="270" width="256" height="58" rx="8"/>
  <text class="text" x="610" y="295" text-anchor="middle">in-memory index + DocStore</text>
  <text class="small" x="610" y="314" text-anchor="middle">n-grams, filters, optional text store</text>

  <rect class="panel app" x="850" y="95" width="220" height="190" rx="10"/>
  <text class="title" x="960" y="140" text-anchor="middle">Application</text>
  <text class="text" x="960" y="174" text-anchor="middle">search traffic goes</text>
  <text class="text" x="960" y="202" text-anchor="middle">to MygramDB</text>
  <path d="M890 235 h140 a18 18 0 0 1 0 36 h-140 a18 18 0 0 1 0-36z" fill="#fed7aa" stroke="#c2410c"/>
  <text class="small" x="960" y="258" text-anchor="middle">TCP 11016 / HTTP 8080</text>

  <path class="dash" d="M280 150 C350 120 392 130 445 150"/>
  <text class="small" x="362" y="113" text-anchor="middle">snapshot SELECT</text>
  <path class="line" d="M280 236 C352 236 384 225 445 225"/>
  <text class="small" x="360" y="220" text-anchor="middle">GTID binlog stream</text>
  <path class="line" d="M775 206 C805 206 820 206 850 206"/>
  <text class="small" x="812" y="188" text-anchor="middle">results</text>
  <path class="dash" d="M850 128 C760 18 378 18 280 128"/>
  <text class="small" x="563" y="36" text-anchor="middle">application writes still go to MySQL</text>

  <text class="small" x="560" y="386" text-anchor="middle">MygramDB is a specialized read replica for full-text search, not a replacement for MySQL storage.</text>
</svg>
