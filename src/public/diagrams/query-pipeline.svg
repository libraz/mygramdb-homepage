<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="470" viewBox="0 0 1130 470" role="img" aria-labelledby="title desc">
  <title id="title">Query execution pipeline</title>
  <desc id="desc">MygramDB runs each query through ordered stages — parse, n-gram lookup, AND intersection, NOT exclusion, filter application, sort, and offset/limit — and the candidate set shrinks at every step, with the counts DEBUG reports named beneath the matching stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .stage{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
      .result{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .chip{fill:#f1f5f9;stroke:#475569;stroke-width:2}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#475569}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .tick{fill:none;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1130" height="470" rx="18"/>

  <text class="title" x="28" y="40">Query execution pipeline</text>

  <!-- pipeline stages -->
  <rect class="stage" x="28" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="89" y="100" text-anchor="middle">parse</text>
  <text class="text" x="89" y="124" text-anchor="middle">&#8594; AST</text>

  <rect class="stage" x="164" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="225" y="100" text-anchor="middle">n-gram</text>
  <text class="text" x="225" y="124" text-anchor="middle">lookup</text>

  <rect class="stage" x="300" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="361" y="100" text-anchor="middle">AND</text>
  <text class="text" x="361" y="124" text-anchor="middle">intersection</text>

  <rect class="stage" x="436" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="497" y="100" text-anchor="middle">NOT</text>
  <text class="text" x="497" y="124" text-anchor="middle">exclusion</text>

  <rect class="stage" x="572" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="633" y="100" text-anchor="middle">FILTER</text>
  <text class="text" x="633" y="124" text-anchor="middle">application</text>

  <rect class="stage" x="708" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="769" y="116" text-anchor="middle">SORT</text>

  <rect class="stage" x="844" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="905" y="100" text-anchor="middle">OFFSET</text>
  <text class="text" x="905" y="124" text-anchor="middle">/ LIMIT</text>

  <rect class="result" x="980" y="66" width="122" height="86" rx="10"/>
  <text class="text" x="1041" y="116" text-anchor="middle">results</text>

  <!-- flow arrows -->
  <path class="line" d="M150 109 L164 109"/>
  <path class="line" d="M286 109 L300 109"/>
  <path class="line" d="M422 109 L436 109"/>
  <path class="line" d="M558 109 L572 109"/>
  <path class="line" d="M694 109 L708 109"/>
  <path class="line" d="M830 109 L844 109"/>
  <path class="line" d="M966 109 L980 109"/>

  <!-- DEBUG metric chips -->
  <rect class="chip" x="173" y="160" width="104" height="26" rx="8"/>
  <text class="small" x="225" y="178" text-anchor="middle">candidates</text>

  <rect class="chip" x="285" y="160" width="152" height="26" rx="8"/>
  <text class="small" x="361" y="178" text-anchor="middle">after_intersection</text>

  <rect class="chip" x="449" y="160" width="96" height="26" rx="8"/>
  <text class="small" x="497" y="178" text-anchor="middle">after_not</text>

  <rect class="chip" x="571" y="160" width="124" height="26" rx="8"/>
  <text class="small" x="633" y="178" text-anchor="middle">after_filters</text>

  <!-- shrinking candidate-set bar -->
  <polygon points="164,208 1102,224 1102,232 164,252" fill="#dbeafe" fill-opacity="0.75" stroke="#1d4ed8" stroke-width="2"/>
  <text class="small" x="170" y="270">candidate set size &#8212; shrinks at every stage</text>

  <!-- annotation connectors -->
  <path class="tick" d="M361 256 L361 286"/>
  <path class="tick" d="M769 256 L769 286"/>
  <path class="tick" d="M633 256 L633 334"/>
  <path class="tick" d="M905 256 L905 334"/>

  <!-- annotations -->
  <text class="small" x="361" y="300" text-anchor="middle">most restrictive term first</text>
  <text class="small" x="361" y="320" text-anchor="middle">shrinks candidates earliest</text>

  <text class="small" x="769" y="300" text-anchor="middle">partial_sort when LIMIT</text>
  <text class="small" x="769" y="320" text-anchor="middle">is present</text>

  <text class="small" x="633" y="348" text-anchor="middle">filters run after text</text>
  <text class="small" x="633" y="368" text-anchor="middle">intersection &#8212; they narrow,</text>
  <text class="small" x="633" y="388" text-anchor="middle">they cannot seed</text>

  <text class="small" x="905" y="348" text-anchor="middle">large OFFSET still pays</text>
  <text class="small" x="905" y="368" text-anchor="middle">for skipped rows</text>

  <!-- footer caption -->
  <text class="small" x="565" y="444" text-anchor="middle">DEBUG reports the candidate count after each stage &#8212; use it to see where a slow query loses time.</text>
</svg>
