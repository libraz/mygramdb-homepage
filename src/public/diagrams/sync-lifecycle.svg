<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">SYNC operation lifecycle and table availability</title>
  <desc id="desc">A SYNC starts from READY, passes a memory-health check that can fail to a FAILED terminal, builds an in-memory snapshot in IN_PROGRESS during which HTTP reads return 503, may be cancelled by SIGTERM, captures a GTID to auto-start replication, and then completes back to READY, while OPTIMIZE and DUMP SAVE/LOAD are mutually excluded.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#be123c"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .ready{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .done{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .gate{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .inprog{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}
      .slate{fill:#f1f5f9;stroke:#475569;stroke-width:2}
      .fail{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}
      .note503{fill:#ffe4e6;stroke:#be123c;stroke-width:2}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#334155;stroke-width:3;stroke-dasharray:8 8;marker-end:url(#arrow)}
      .rose{fill:none;stroke:#be123c;stroke-width:3;marker-end:url(#arrow-rose)}
      .tick{fill:none;stroke:#b45309;stroke-width:2}
      .conn{fill:none;stroke:#be123c;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1120" height="560" rx="18"/>

  <!-- 503 note capsule attached above IN_PROGRESS -->
  <rect class="note503" x="425" y="8" width="262" height="54" rx="27"/>
  <text class="small" x="556" y="32" text-anchor="middle">HTTP search / count / facet / get</text>
  <text class="small" x="556" y="52" text-anchor="middle">return 503 for this table</text>
  <path class="conn" d="M556 62 L556 78"/>

  <!-- happy path row -->
  <rect class="ready" x="25" y="90" width="155" height="70" rx="10"/>
  <text class="title" x="102" y="123" text-anchor="middle">READY</text>
  <text class="small" x="102" y="146" text-anchor="middle">serving queries</text>

  <polygon class="gate" points="310,67 393,125 310,183 227,125"/>
  <text class="text" x="310" y="120" text-anchor="middle">memory-health</text>
  <text class="text" x="310" y="142" text-anchor="middle">check</text>

  <rect class="inprog" x="430" y="78" width="250" height="94" rx="10"/>
  <text class="title" x="555" y="110" text-anchor="middle">IN_PROGRESS</text>
  <text class="small" x="555" y="134" text-anchor="middle">snapshot build from</text>
  <text class="small" x="555" y="154" text-anchor="middle">MySQL SELECT</text>

  <rect class="slate" x="720" y="92" width="118" height="66" rx="8"/>
  <text class="text" x="779" y="119" text-anchor="middle">GTID</text>
  <text class="text" x="779" y="141" text-anchor="middle">captured</text>

  <rect class="gate" x="880" y="80" width="210" height="90" rx="10"/>
  <text class="text" x="985" y="114" text-anchor="middle">automatic</text>
  <text class="text" x="985" y="136" text-anchor="middle">replication start</text>
  <text class="small" x="985" y="158" text-anchor="middle">after GTID capture</text>

  <!-- outcome chips under replication start -->
  <path class="tick" d="M985 170 L985 182"/>
  <text class="small" x="985" y="197" text-anchor="middle">start outcome</text>
  <rect class="done" x="880" y="206" width="210" height="26" rx="6"/>
  <text class="small" x="985" y="223" text-anchor="middle">STARTED</text>
  <rect class="slate" x="880" y="236" width="210" height="26" rx="6"/>
  <text class="small" x="985" y="253" text-anchor="middle">ALREADY_RUNNING</text>
  <rect class="slate" x="880" y="266" width="210" height="26" rx="6"/>
  <text class="small" x="985" y="283" text-anchor="middle">DISABLED</text>
  <rect class="fail" x="880" y="296" width="210" height="26" rx="6"/>
  <text class="small" x="985" y="313" text-anchor="middle">FAILED</text>

  <!-- terminals -->
  <rect class="fail" x="235" y="250" width="150" height="66" rx="10"/>
  <text class="title" x="310" y="282" text-anchor="middle">FAILED</text>
  <text class="small" x="310" y="303" text-anchor="middle">table stays READY</text>

  <rect class="slate" x="460" y="250" width="210" height="66" rx="10"/>
  <text class="title" x="565" y="280" text-anchor="middle">CANCELLED</text>
  <text class="small" x="565" y="302" text-anchor="middle">graceful shutdown</text>

  <rect class="done" x="880" y="360" width="210" height="64" rx="10"/>
  <text class="title" x="985" y="390" text-anchor="middle">COMPLETED</text>
  <text class="small" x="985" y="412" text-anchor="middle">table returns to READY</text>

  <!-- mutual-exclusion side note -->
  <rect class="gate" x="30" y="360" width="400" height="90" rx="10"/>
  <text class="text" x="230" y="392" text-anchor="middle" style="font-weight:700">Mutual exclusion</text>
  <text class="small" x="230" y="416" text-anchor="middle">SYNC is rejected while OPTIMIZE or</text>
  <text class="small" x="230" y="437" text-anchor="middle">DUMP SAVE / LOAD runs (and vice versa)</text>

  <!-- flow arrows -->
  <path class="line" d="M180 125 L227 125"/>
  <text class="small" x="203" y="58" text-anchor="middle">SYNC &lt;db.table&gt;</text>
  <path class="line" d="M393 125 L430 125"/>
  <text class="small" x="411" y="150" text-anchor="middle">pass</text>
  <path class="line" d="M680 125 L720 125"/>
  <path class="line" d="M838 125 L880 125"/>

  <path class="rose" d="M310 183 L310 250"/>
  <text class="small" x="333" y="222" text-anchor="middle" fill="#be123c">fail</text>

  <path class="dash" d="M555 172 L560 250"/>
  <text class="small" x="612" y="208" text-anchor="middle">SIGTERM</text>

  <path class="line" d="M1090 125 C1112 240 1108 330 1052 358"/>

  <!-- loop back to READY -->
  <path class="line" d="M878 402 C620 505 220 505 60 495 C26 490 14 430 14 300 C14 205 44 168 90 160"/>
  <text class="small" x="700" y="390" text-anchor="middle">returns to READY</text>

  <text class="small" x="560" y="546" text-anchor="middle">Clients should treat 503 during IN_PROGRESS as retry-after-readiness, not as an error.</text>
</svg>
