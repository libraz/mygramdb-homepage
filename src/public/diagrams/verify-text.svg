<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="420" viewBox="0 0 1060 420" role="img" aria-labelledby="title desc">
  <title id="title">verify_text post-filter</title>
  <desc id="desc">N-gram search first collects candidates. verify_text checks stored normalized text and removes false positives before sorting and pagination.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .good{fill:#dcfce7;stroke:#15803d;stroke-width:2}
      .mid{fill:#f1f5f9;stroke:#475569;stroke-width:2}
      .bad{fill:#ffe4e6;stroke:#be123c;stroke-width:2}
      .check{fill:#fef3c7;stroke:#b45309;stroke-width:2}
      .title{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .text{font:500 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#64748b}
      .line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1060" height="420" rx="18"/>
  <rect class="box" x="40" y="70" width="220" height="250" rx="10"/>
  <text class="title" x="150" y="112" text-anchor="middle">Query</text>
  <text class="text" x="150" y="155" text-anchor="middle">"quantum"</text>
  <text class="small" x="150" y="190" text-anchor="middle">bi-grams</text>
  <text class="small" x="150" y="218" text-anchor="middle">qu ua an nt tu um</text>

  <rect class="box" x="330" y="70" width="260" height="250" rx="10"/>
  <text class="title" x="460" y="112" text-anchor="middle">N-gram intersection</text>
  <text class="text" x="460" y="154" text-anchor="middle">fast candidate lookup</text>
  <text class="small" x="460" y="187" text-anchor="middle">may include documents that contain</text>
  <text class="small" x="460" y="209" text-anchor="middle">all pieces but not the exact phrase</text>
  <rect class="mid" x="372" y="238" width="176" height="34" rx="7"/>
  <text class="small" x="460" y="260" text-anchor="middle">candidate DocIDs</text>

  <rect class="check" x="660" y="70" width="190" height="250" rx="10"/>
  <text class="title" x="755" y="112" text-anchor="middle">verify_text</text>
  <text class="text" x="755" y="154" text-anchor="middle">check stored</text>
  <text class="text" x="755" y="178" text-anchor="middle">normalized text</text>
  <text class="small" x="755" y="218" text-anchor="middle">enabled by</text>
  <text class="small" x="755" y="245" text-anchor="middle">memory.verify_text</text>

  <rect class="good" x="910" y="82" width="120" height="90" rx="10"/>
  <text class="title" x="970" y="116" text-anchor="middle">Keep</text>
  <text class="small" x="970" y="146" text-anchor="middle">actual match</text>
  <rect class="bad" x="910" y="210" width="120" height="90" rx="10"/>
  <text class="title" x="970" y="244" text-anchor="middle">Drop</text>
  <text class="small" x="970" y="274" text-anchor="middle">false positive</text>

  <path class="line" d="M260 195 L330 195"/>
  <path class="line" d="M590 195 L660 195"/>
  <path class="line" d="M850 150 L910 126"/>
  <path class="line" d="M850 240 L910 255"/>
  <text class="small" x="530" y="360" text-anchor="middle">Without verify_text, n-gram candidates can be returned directly. With it, MygramDB spends extra memory to get exact substring confirmation.</text>
</svg>
