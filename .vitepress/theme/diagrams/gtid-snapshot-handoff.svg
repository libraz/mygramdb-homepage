<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 408" role="img">
  <title>Consistent snapshot to binlog handoff</title>
  <defs>
    <marker id="gs-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="gs-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- guides sit behind the boxes so the opaque shapes hide the segments that cross them -->
  <path class="seam" d="M 300 96 V 290"/>
  <path class="seam" d="M 640 40 V 290"/>

  <!-- shapes -->
  <rect class="card" x="24" y="40" width="352" height="56" rx="8"/>
  <rect class="chip" x="656" y="40" width="160" height="32" rx="5"/>

  <rect class="alt" x="300" y="112" width="636" height="60" rx="8"/>

  <rect class="card" x="300" y="290" width="340" height="64" rx="8"/>
  <rect class="card" x="656" y="290" width="280" height="64" rx="8"/>

  <path class="rule" d="M 24 374 H 936"/>

  <!-- timeline -->
  <path class="ln2" d="M 40 232 H 640"/>
  <path class="ln" d="M 640 232 H 934" marker-end="url(#gs-a)"/>
  <path class="rule" d="M 100 225 V 239"/>
  <path class="rule" d="M 180 225 V 239"/>
  <path class="rule" d="M 400 225 V 239"/>
  <path class="rule" d="M 500 225 V 239"/>
  <path class="rule" d="M 640 225 V 239"/>
  <polygon class="card" points="300,219 313,232 300,245 287,232"/>

  <!-- language-neutral text -->
  <text class="mono" x="100" y="214" text-anchor="middle">N-2</text>
  <text class="mono" x="180" y="214" text-anchor="middle">N-1</text>
  <text class="mono" x="400" y="214" text-anchor="middle">N+1</text>
  <text class="mono" x="500" y="214" text-anchor="middle">…</text>
  <text class="mono" x="650" y="214">M</text>
  <text class="mono" x="316" y="268">t0 = N</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="h" x="40" y="66">Capture safe lower-bound GTID = N</text>
    <text class="s" x="40" y="84">then <tspan class="mono">START TRANSACTION WITH CONSISTENT SNAPSHOT</tspan></text>
    <text class="h" x="672" y="61">no missed commits</text>

    <text class="h" x="316" y="138">application writes continue</text>
    <text class="s" x="316" y="156">transactions after N appear in the binlog</text>

    <text class="s" x="936" y="214" text-anchor="end">real time →</text>

    <text class="h" x="316" y="316">table data read inside the transaction</text>
    <text class="s" x="316" y="334">the view may include commits after N</text>

    <text class="h" x="672" y="316">replay after N</text>
    <text class="s" x="672" y="334">then follow live writes</text>

    <text class="s" x="480" y="398" text-anchor="middle">The lower bound prevents gaps; some commits may replay after the snapshot, and row updates are idempotent.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="h" x="40" y="66">安全な下限 GTID = N を取得</text>
    <text class="s" x="40" y="84">その後に整合スナップショットのトランザクションを開始</text>
    <text class="h" x="672" y="61">コミットの欠落なし</text>

    <text class="h" x="316" y="138">アプリの書き込みは続く</text>
    <text class="s" x="316" y="156">N 以降のトランザクションが binlog に記録される</text>

    <text class="s" x="936" y="214" text-anchor="end">実時間 →</text>

    <text class="h" x="316" y="316">テーブルはこのトランザクション内で読む</text>
    <text class="s" x="316" y="334">N より後のコミットを含む場合がある</text>

    <text class="h" x="672" y="316">N 以降を再適用</text>
    <text class="s" x="672" y="334">追いついた後は継続追従</text>

    <text class="s" x="480" y="398" text-anchor="middle">下限で欠落を防ぎます。スナップショット後に一部を再適用する場合がありますが、行更新は冪等です。</text>
  </g>
</svg>
