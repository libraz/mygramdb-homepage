<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 304" role="img">
  <title>verify_text post-filter</title>
  <defs>
    <marker id="vt-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="vt-w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="warnt" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <rect class="grp" x="24" y="32" width="912" height="192" rx="8"/>
  <rect class="chip" x="40" y="48" width="150" height="160" rx="5"/>
  <rect class="chip" x="236" y="48" width="210" height="160" rx="5"/>
  <rect class="card" x="492" y="48" width="180" height="160" rx="5"/>
  <rect class="chip" x="726" y="48" width="194" height="74" rx="5"/>
  <rect class="warn" x="726" y="134" width="194" height="74" rx="5"/>

  <path class="ln" d="M191 128 H235" marker-end="url(#vt-a)"/>
  <path class="ln" d="M447 128 H491" marker-end="url(#vt-a)"/>
  <path class="ln" d="M673 128 H699 V85 H725" marker-end="url(#vt-a)"/>
  <path class="warn" d="M699 128 V171 H725" marker-end="url(#vt-w)"/>

  <!-- language-neutral text -->
  <text class="mono" x="115" y="112" text-anchor="middle">"quantum"</text>
  <text class="mono" x="115" y="172" text-anchor="middle">qu ua an nt tu um</text>
  <text class="mono" x="582" y="76" text-anchor="middle">verify_text</text>
  <text class="mono" x="582" y="180" text-anchor="middle">memory.verify_text</text>

  <g data-i18n="en">
    <text class="h" x="115" y="76" text-anchor="middle">Query</text>
    <text class="s" x="115" y="148" text-anchor="middle">bi-grams</text>
    <text class="h" x="341" y="76" text-anchor="middle">N-gram intersection</text>
    <text x="341" y="108" text-anchor="middle">fast candidate lookup</text>
    <text class="s" x="341" y="140" text-anchor="middle">may include documents holding</text>
    <text class="s" x="341" y="156" text-anchor="middle">every piece but not the phrase</text>
    <text class="s" x="341" y="188" text-anchor="middle">candidate DocIDs</text>
    <text x="582" y="108" text-anchor="middle">check stored</text>
    <text x="582" y="124" text-anchor="middle">normalized text</text>
    <text class="s" x="582" y="160" text-anchor="middle">enabled by</text>
    <text class="h" x="823" y="80" text-anchor="middle">Keep</text>
    <text class="s" x="823" y="102" text-anchor="middle">actual match</text>
    <text class="h warnt" x="823" y="166" text-anchor="middle">Drop</text>
    <text class="s warnt" x="823" y="188" text-anchor="middle">false positive</text>
    <text class="s" x="480" y="258" text-anchor="middle">Without verify_text, n-gram candidates are returned as they are.</text>
    <text class="s" x="480" y="280" text-anchor="middle">With it, MygramDB trades extra memory for exact substring confirmation.</text>
  </g>

  <g data-i18n="ja">
    <text class="h" x="115" y="76" text-anchor="middle">クエリ</text>
    <text class="s" x="115" y="148" text-anchor="middle">バイグラム</text>
    <text class="h" x="341" y="76" text-anchor="middle">N-gram 積集合</text>
    <text x="341" y="108" text-anchor="middle">候補を高速に絞り込む</text>
    <text class="s" x="341" y="140" text-anchor="middle">断片をすべて含むが</text>
    <text class="s" x="341" y="156" text-anchor="middle">語順が違う文書も混ざる</text>
    <text class="s" x="341" y="188" text-anchor="middle">候補 DocID</text>
    <text x="582" y="108" text-anchor="middle">保存済みの</text>
    <text x="582" y="124" text-anchor="middle">正規化テキストと照合</text>
    <text class="s" x="582" y="160" text-anchor="middle">有効化設定</text>
    <text class="h" x="823" y="80" text-anchor="middle">残す</text>
    <text class="s" x="823" y="102" text-anchor="middle">実際に一致</text>
    <text class="h warnt" x="823" y="166" text-anchor="middle">捨てる</text>
    <text class="s warnt" x="823" y="188" text-anchor="middle">偽陽性</text>
    <text class="s" x="480" y="258" text-anchor="middle">verify_text なしなら、N-gram の候補はそのまま返されます。</text>
    <text class="s" x="480" y="280" text-anchor="middle">有効にすると、メモリを追加で使う代わりに部分文字列の一致を厳密に確認します。</text>
  </g>
</svg>
