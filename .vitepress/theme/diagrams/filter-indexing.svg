<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 344" role="img">
  <title>Required filters versus search-time filters</title>
  <defs>
    <marker id="fi-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="fi-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="fi-w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="warnt" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- shapes -->
  <rect class="alt" x="24" y="40" width="152" height="176" rx="8"/>

  <rect class="card" x="224" y="40" width="224" height="176" rx="8"/>
  <rect class="chip" x="240" y="140" width="192" height="60" rx="5"/>

  <rect class="card" x="496" y="40" width="200" height="176" rx="8"/>
  <rect class="chip" x="512" y="78" width="168" height="28" rx="5"/>
  <rect class="chip" x="512" y="114" width="168" height="28" rx="5"/>
  <rect class="chip" x="512" y="150" width="168" height="28" rx="5"/>

  <rect class="chip" x="744" y="40" width="192" height="176" rx="8"/>

  <rect class="warn" x="224" y="256" width="472" height="64" rx="8"/>

  <!-- edges -->
  <path class="ln2" d="M 176 128 H 222" marker-end="url(#fi-b)"/>
  <path class="ln" d="M 448 128 H 494" marker-end="url(#fi-a)"/>
  <path class="ln" d="M 696 128 H 742" marker-end="url(#fi-a)"/>
  <path class="warn" d="M 336 216 V 254" marker-end="url(#fi-w)"/>

  <!-- language-neutral text -->
  <text class="mono" x="40" y="100">id, text</text>
  <text class="mono" x="40" y="122">enabled</text>
  <text class="mono" x="40" y="144">deleted_at</text>
  <text class="mono" x="40" y="166">status, category</text>

  <text class="h" x="240" y="66">required_filters</text>
  <text class="mono" x="256" y="165">deleted_at IS NULL</text>
  <text class="mono" x="256" y="183">AND enabled = 1</text>

  <text class="h" x="512" y="66">Index</text>
  <text class="mono" x="528" y="132">DocStore</text>
  <text class="mono" x="760" y="100">SEARCH ...</text>
  <text class="mono" x="760" y="122">FILTER status=1</text>
  <text class="mono" x="760" y="144">FILTER category=tech</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="h" x="40" y="66">MySQL rows</text>

    <text class="s" x="240" y="92">decide which rows</text>
    <text class="s" x="240" y="108">enter the index at all</text>

    <text x="528" y="96">n-gram posting lists</text>
    <text x="528" y="168">filter values</text>

    <text class="s" x="512" y="198">only eligible rows are here</text>
    <text class="h" x="760" y="66">Query</text>
    <text class="s" x="760" y="198">narrows indexed rows</text>

    <text class="s warnt" x="348" y="240">no match</text>
    <text class="h" x="240" y="282">Rows that fail <tspan class="mono">required_filters</tspan></text>
    <text class="s" x="240" y="302">never enter search results until an UPDATE makes them eligible</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="h" x="40" y="66">MySQL の行</text>

    <text class="s" x="240" y="92">そもそもインデックスに</text>
    <text class="s" x="240" y="108">入れる行を決める</text>

    <text x="528" y="96">ポスティングリスト</text>
    <text x="528" y="168">フィルタ値</text>

    <text class="s" x="512" y="198">対象行だけが存在する</text>
    <text class="h" x="760" y="66">クエリ</text>
    <text class="s" x="760" y="198">インデックス内の行を絞る</text>

    <text class="s warnt" x="348" y="240">不一致</text>
    <text class="h" x="240" y="282"><tspan class="mono">required_filters</tspan> を満たさない行</text>
    <text class="s" x="240" y="302">UPDATE で条件を満たすまで、検索結果には一切現れません</text>
  </g>
</svg>
