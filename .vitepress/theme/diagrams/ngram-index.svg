<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1120 450" role="img">
  <title>N-gram index structure</title>
  <defs>
    <marker id="ni-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="var(--ln)"/>
    </marker>
    <style>
      .dg{--fs:16px;
        --dgf:'IBM Plex Sans','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,system-ui,sans-serif;
        --dgm:'IBM Plex Mono','SF Mono',Consolas,monospace;
        --ink:var(--dg-ink,#0f172a);--txt:var(--dg-text,#334155);--mut:var(--dg-muted,#64748b);
        --ln:var(--dg-line,#475569);--gd:var(--dg-guide,#cbd5e1);--gr:var(--dg-green-br,#15803d)}
      .dg text{font-family:var(--dgf);font-size:var(--fs);font-weight:500;fill:var(--txt)}
      .dg .t{font-size:calc(var(--fs)*1.14);font-weight:700;fill:var(--ink)}
      .dg .g{font-size:calc(var(--fs)*0.82);font-weight:700;fill:var(--mut);letter-spacing:.08em}
      .dg .s{font-size:calc(var(--fs)*0.82);fill:var(--mut)}
      .dg .m{font-family:var(--dgm);font-size:calc(var(--fs)*0.9);fill:var(--ink)}
      .dg .k{font-family:var(--dgm);font-size:calc(var(--fs)*0.98);font-weight:700;fill:var(--ink)}
      .dg .hit{font-family:var(--dgm);font-size:calc(var(--fs)*0.9);font-weight:700;fill:var(--gr)}
      .dg .box{stroke-width:2}
      .dg .sky{fill:var(--dg-sky-bg,#e0f2fe);stroke:var(--dg-sky-br,#0369a1)}
      .dg .blue{fill:var(--dg-blue-bg,#dbeafe);stroke:var(--dg-blue-br,#1d4ed8)}
      .dg .slate{fill:var(--dg-slate-bg,#f1f5f9);stroke:var(--dg-slate-br,#64748b)}
      .dg .green{fill:var(--dg-green-bg,#dcfce7);stroke:var(--dg-green-br,#15803d)}
      .dg .e{fill:none;stroke:var(--ln);stroke-width:2;marker-end:url(#ni-a)}
      .dg .spine{fill:none;stroke:var(--gd);stroke-width:2}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- source term -->
  <rect class="box sky" x="24" y="150" width="212" height="112" rx="12"/>

  <!-- connector -->
  <path class="e" d="M240 206 L282 206"/>
  <path class="spine" d="M284 84 L284 330"/>
  <path class="e" d="M284 84 L326 84"/>
  <path class="e" d="M284 145 L326 145"/>
  <path class="e" d="M284 206 L326 206"/>
  <path class="e" d="M284 267 L326 267"/>
  <path class="e" d="M284 328 L326 328"/>

  <!-- ngram chips -->
  <rect class="box blue" x="330" y="62" width="88" height="44" rx="9"/>
  <rect class="box blue" x="330" y="123" width="88" height="44" rx="9"/>
  <rect class="box blue" x="330" y="184" width="88" height="44" rx="9"/>
  <rect class="box blue" x="330" y="245" width="88" height="44" rx="9"/>
  <rect class="box blue" x="330" y="306" width="88" height="44" rx="9"/>

  <!-- posting lists -->
  <rect class="box slate" x="436" y="62" width="560" height="44" rx="9"/>
  <rect class="box slate" x="436" y="123" width="560" height="44" rx="9"/>
  <rect class="box slate" x="436" y="184" width="560" height="44" rx="9"/>
  <rect class="box slate" x="436" y="245" width="560" height="44" rx="9"/>
  <rect class="box slate" x="436" y="306" width="560" height="44" rx="9"/>

  <!-- shared DocID highlight -->
  <rect class="box green" x="1010" y="62" width="86" height="288" rx="10"/>

  <!-- static labels (identical in both locales) -->
  <text class="k" x="374" y="92" text-anchor="middle">se</text>
  <text class="k" x="374" y="153" text-anchor="middle">ea</text>
  <text class="k" x="374" y="214" text-anchor="middle">ar</text>
  <text class="k" x="374" y="275" text-anchor="middle">rc</text>
  <text class="k" x="374" y="336" text-anchor="middle">ch</text>

  <text class="m" x="460" y="92">1, 5, <tspan class="hit">42</tspan>, 108, 233, …</text>
  <text class="m" x="460" y="153">1, 5, 23, <tspan class="hit">42</tspan>, 190, …</text>
  <text class="m" x="460" y="214">1, 9, <tspan class="hit">42</tspan>, 77, 301, …</text>
  <text class="m" x="460" y="275">1, <tspan class="hit">42</tspan>, 55, 402, …</text>
  <text class="m" x="460" y="336">1, 3, <tspan class="hit">42</tspan>, 61, 118, …</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="t" x="130" y="190" text-anchor="middle">"search"</text>
    <text class="s" x="130" y="222" text-anchor="middle">split into bi-grams</text>
    <text class="s" x="130" y="244" text-anchor="middle">at index time</text>

    <text class="g" x="374" y="42" text-anchor="middle">N-GRAM</text>
    <text class="g" x="716" y="42" text-anchor="middle">POSTING LIST — SORTED DOCIDS</text>

    <text class="t" x="1053" y="182" text-anchor="middle">1, 42</text>
    <text class="s" x="1053" y="212" text-anchor="middle">in every</text>
    <text class="s" x="1053" y="232" text-anchor="middle">list</text>

    <text class="s" x="560" y="392" text-anchor="middle">A search intersects the posting lists of every n-gram in the term. Only documents present in all of them survive.</text>
    <text class="s" x="560" y="424" text-anchor="middle">No dictionary is involved, so the same mechanism works for any language and for mixed-script text.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="t" x="130" y="190" text-anchor="middle">"search"</text>
    <text class="s" x="130" y="222" text-anchor="middle">インデックス時に</text>
    <text class="s" x="130" y="244" text-anchor="middle">バイグラムへ分割</text>

    <text class="g" x="374" y="42" text-anchor="middle">N-GRAM</text>
    <text class="g" x="716" y="42" text-anchor="middle">ポスティングリスト（DocID 昇順）</text>

    <text class="t" x="1053" y="182" text-anchor="middle">1, 42</text>
    <text class="s" x="1053" y="212" text-anchor="middle">すべてに</text>
    <text class="s" x="1053" y="232" text-anchor="middle">出現</text>

    <text class="s" x="560" y="392" text-anchor="middle">検索では、語を構成する全 N-gram のポスティングリストを積集合します。すべてに含まれる文書だけが残ります。</text>
    <text class="s" x="560" y="424" text-anchor="middle">辞書を使わないため、同じ仕組みがどの言語にも、文字種が混在するテキストにも通用します。</text>
  </g>
</svg>
