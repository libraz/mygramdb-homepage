<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 388" role="img">
  <title>N-gram index structure</title>
  <defs>
    <marker id="ni-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="ni-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- source term -->
  <rect class="chip" x="24" y="134" width="176" height="88" rx="8"/>
  <path class="ln" d="M 200 178 H 232"/>
  <path class="ln" d="M 232 74 V 282"/>
  <!-- shared DocID column -->
  <rect class="fill1" x="832" y="48" width="104" height="260" rx="8"/>
  <path class="ln" d="M 232 74 H 255" marker-end="url(#ni-a)"/>
  <rect class="card" x="256" y="56" width="64" height="36" rx="5"/>
  <rect class="chip" x="336" y="56" width="480" height="36" rx="5"/>
  <path class="ln" d="M 232 126 H 255" marker-end="url(#ni-a)"/>
  <rect class="card" x="256" y="108" width="64" height="36" rx="5"/>
  <rect class="chip" x="336" y="108" width="480" height="36" rx="5"/>
  <path class="ln" d="M 232 178 H 255" marker-end="url(#ni-a)"/>
  <rect class="card" x="256" y="160" width="64" height="36" rx="5"/>
  <rect class="chip" x="336" y="160" width="480" height="36" rx="5"/>
  <path class="ln" d="M 232 230 H 255" marker-end="url(#ni-a)"/>
  <rect class="card" x="256" y="212" width="64" height="36" rx="5"/>
  <rect class="chip" x="336" y="212" width="480" height="36" rx="5"/>
  <path class="ln" d="M 232 282 H 255" marker-end="url(#ni-a)"/>
  <rect class="card" x="256" y="264" width="64" height="36" rx="5"/>
  <rect class="chip" x="336" y="264" width="480" height="36" rx="5"/>
  <rect class="fill1" x="387.8" y="65" width="16.6" height="18" rx="3"/>
  <text class="mono" x="389.8" y="78">42</text>
  <text class="mono" x="402.4" y="78">, 108, 233, …</text>
  <rect class="fill1" x="413.0" y="117" width="16.6" height="18" rx="3"/>
  <text class="mono" x="415.0" y="130">42</text>
  <text class="mono" x="427.6" y="130">, 190, …</text>
  <rect class="fill1" x="387.8" y="169" width="16.6" height="18" rx="3"/>
  <text class="mono" x="389.8" y="182">42</text>
  <text class="mono" x="402.4" y="182">, 77, 301, …</text>
  <rect class="fill1" x="368.9" y="221" width="16.6" height="18" rx="3"/>
  <text class="mono" x="370.9" y="234">42</text>
  <text class="mono" x="383.5" y="234">, 55, 402, …</text>
  <rect class="fill1" x="387.8" y="273" width="16.6" height="18" rx="3"/>
  <text class="mono" x="389.8" y="286">42</text>
  <text class="mono" x="402.4" y="286">, 61, 118, …</text>

  <!-- language-neutral text -->
  <text class="lbl" x="256" y="36">N-GRAM</text>
  <text class="mono" x="40" y="160">"search"</text>
  <text class="h" x="884" y="164" text-anchor="middle">1, 42</text>
  <text class="mono" x="288" y="78" text-anchor="middle">se</text>
  <text class="mono" x="352" y="78">1, 5, </text>
  <text class="mono" x="288" y="130" text-anchor="middle">ea</text>
  <text class="mono" x="352" y="130">1, 5, 23, </text>
  <text class="mono" x="288" y="182" text-anchor="middle">ar</text>
  <text class="mono" x="352" y="182">1, 9, </text>
  <text class="mono" x="288" y="234" text-anchor="middle">rc</text>
  <text class="mono" x="352" y="234">1, </text>
  <text class="mono" x="288" y="286" text-anchor="middle">ch</text>
  <text class="mono" x="352" y="286">1, 3, </text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="s" x="40" y="182">split into bi-grams</text>
    <text class="s" x="40" y="197">at index time</text>
    <text class="lbl" x="336" y="36">POSTING LIST — SORTED DOCIDS</text>
    <text class="s" x="884" y="188" text-anchor="middle">in every</text>
    <text class="s" x="884" y="203" text-anchor="middle">list</text>
    <text class="s" x="480" y="340" text-anchor="middle">A search intersects the posting lists of every n-gram in the term. Only documents present in all of them survive.</text>
    <text class="s" x="480" y="362" text-anchor="middle">No dictionary is involved, so the same mechanism works for any language and for mixed-script text.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="s" x="40" y="182">インデックス時に</text>
    <text class="s" x="40" y="197">バイグラムへ分割</text>
    <text class="lbl" x="336" y="36">ポスティングリスト（DocID 昇順）</text>
    <text class="s" x="884" y="188" text-anchor="middle">すべてに</text>
    <text class="s" x="884" y="203" text-anchor="middle">出現</text>
    <text class="s" x="480" y="340" text-anchor="middle">検索では、語を構成する全 N-gram のポスティングリストを積集合します。すべてに含まれるドキュメントだけが残ります。</text>
    <text class="s" x="480" y="362" text-anchor="middle">辞書を使わないため、同じ仕組みがどの言語にも、文字種が混在するテキストにも通用します。</text>
  </g>
</svg>
