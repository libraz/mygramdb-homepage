<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 336" role="img">
  <title>MygramDB system flow</title>
  <defs>
    <marker id="sf-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sf-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- shapes -->
  <rect class="alt" x="24" y="56" width="184" height="168" rx="8"/>

  <rect class="card" x="340" y="24" width="300" height="232" rx="8"/>
  <rect class="chip" x="356" y="66" width="268" height="52" rx="5"/>
  <rect class="chip" x="356" y="128" width="268" height="52" rx="5"/>
  <rect class="chip" x="356" y="190" width="268" height="52" rx="5"/>

  <rect class="chip" x="756" y="56" width="180" height="168" rx="8"/>

  <!-- edges -->
  <path class="ln2 dash" d="M 208 92 H 354" marker-end="url(#sf-b)"/>
  <path class="ln2" d="M 208 154 H 354" marker-end="url(#sf-b)"/>
  <path class="ln" d="M 756 204 H 642" marker-end="url(#sf-a)"/>
  <path class="ln" d="M 640 226 H 754" marker-end="url(#sf-a)"/>
  <path class="ln2 dash" d="M 846 224 V 280 H 116 V 226" marker-end="url(#sf-b)"/>

  <!-- language-neutral text -->
  <text class="h" x="40" y="104">MySQL / MariaDB</text>
  <text class="h" x="356" y="50">MygramDB</text>
  <text class="mono" x="274" y="106" text-anchor="middle">SELECT</text>
  <text class="mono" x="370" y="168">INSERT / UPDATE / DELETE</text>
  <text class="mono" x="772" y="196">TCP 11016 · HTTP 8080</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="lbl" x="40" y="80">source of truth</text>
    <text class="s" x="40" y="150">writes and normal SQL</text>
    <text class="s" x="40" y="165">stay here</text>

    <text class="lbl" x="624" y="50" text-anchor="end">search replica</text>
    <text class="h" x="370" y="88">consistent snapshot / SYNC</text>
    <text class="s" x="370" y="106">builds the initial index</text>
    <text class="h" x="370" y="150">binlog reader</text>
    <text class="h" x="370" y="212">in-memory index</text>
    <text class="s" x="370" y="230">DocStore · n-grams · filters</text>

    <text class="lbl" x="772" y="80">client</text>
    <text class="h" x="772" y="104">Application</text>
    <text class="s" x="772" y="150">search traffic goes</text>
    <text class="s" x="772" y="165">to MygramDB</text>

    <text class="s" x="274" y="84" text-anchor="middle">initial snapshot</text>
    <text class="s" x="274" y="146" text-anchor="middle">GTID binlog stream</text>
    <text class="s" x="698" y="198" text-anchor="middle">query</text>
    <text class="s" x="698" y="240" text-anchor="middle">results</text>
    <text class="s" x="480" y="298" text-anchor="middle">application writes still go to MySQL</text>

    <text class="s" x="480" y="324" text-anchor="middle">MygramDB is a specialized read replica for full-text search, not a replacement for MySQL storage.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="lbl" x="40" y="80">正となるデータ</text>
    <text class="s" x="40" y="150">書き込みと通常の SQL は</text>
    <text class="s" x="40" y="165">これまでどおり</text>

    <text class="lbl" x="624" y="50" text-anchor="end">検索レプリカ</text>
    <text class="h" x="370" y="88">整合スナップショット / SYNC</text>
    <text class="s" x="370" y="106">初回インデックスを構築</text>
    <text class="h" x="370" y="150">binlog リーダー</text>
    <text class="h" x="370" y="212">インメモリインデックス</text>
    <text class="s" x="370" y="230">DocStore・N-gram・フィルタ</text>

    <text class="lbl" x="772" y="80">利用側</text>
    <text class="h" x="772" y="104">アプリケーション</text>
    <text class="s" x="772" y="150">検索リクエストは</text>
    <text class="s" x="772" y="165">MygramDB へ</text>

    <text class="s" x="274" y="84" text-anchor="middle">初回スナップショット</text>
    <text class="s" x="274" y="146" text-anchor="middle">GTID binlog ストリーム</text>
    <text class="s" x="698" y="198" text-anchor="middle">クエリ</text>
    <text class="s" x="698" y="240" text-anchor="middle">検索結果</text>
    <text class="s" x="480" y="298" text-anchor="middle">アプリの書き込みは従来どおり MySQL へ</text>

    <text class="s" x="480" y="324" text-anchor="middle">MygramDB は全文検索に特化した読み取り専用レプリカで、MySQL ストレージの置き換えではありません。</text>
  </g>
</svg>
