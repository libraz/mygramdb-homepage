<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 552" role="img">
  <title>MygramDB thread model</title>
  <defs>
    <marker id="tm-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="tm-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <rect class="grp" x="24" y="16" width="210" height="156" rx="8"/>
  <rect class="grp" x="258" y="16" width="210" height="156" rx="8"/>
  <rect class="grp" x="492" y="16" width="210" height="156" rx="8"/>
  <rect class="grp" x="726" y="16" width="210" height="156" rx="8"/>
  <rect class="grp" x="233" y="236" width="444" height="136" rx="8"/>

  <rect class="chip" x="40" y="48" width="178" height="50" rx="5"/>
  <rect class="chip" x="40" y="106" width="178" height="50" rx="5"/>
  <rect class="card" x="274" y="48" width="178" height="84" rx="5"/>
  <rect class="alt" x="508" y="48" width="178" height="84" rx="5"/>
  <rect class="chip" x="742" y="48" width="178" height="84" rx="5"/>

  <rect class="chip" x="249" y="274" width="128" height="82" rx="5"/>
  <rect class="chip" x="391" y="274" width="128" height="82" rx="5"/>
  <rect class="card" x="533" y="274" width="128" height="82" rx="5"/>

  <rect class="card" x="263" y="428" width="384" height="64" rx="5"/>

  <!-- edges -->
  <path class="ln" d="M363 172 V204 H313 V235" marker-end="url(#tm-a)"/>
  <path class="ln" d="M363 204 H455 V235" marker-end="url(#tm-a)"/>
  <path class="ln2" d="M597 172 V235" marker-end="url(#tm-b)"/>
  <path class="ln" d="M313 357 V427" marker-end="url(#tm-a)"/>
  <path class="ln" d="M455 357 V427" marker-end="url(#tm-a)"/>
  <path class="ln" d="M597 357 V427" marker-end="url(#tm-a)"/>

  <!-- language-neutral text -->
  <text class="mono" x="321" y="396">read lock</text>
  <text class="mono" x="463" y="396">read lock</text>
  <text class="mono" x="605" y="396">write lock</text>

  <g data-i18n="en">
    <text class="lbl" x="40" y="37">MAIN THREAD</text>
    <text class="h" x="54" y="68">Initialization</text>
    <text class="s" x="54" y="86">config, snapshot load</text>
    <text class="h" x="54" y="126">Server orchestrator</text>
    <text class="s" x="54" y="144">lifecycle management</text>

    <text class="lbl" x="274" y="37">REACTOR THREAD</text>
    <text class="h" x="288" y="78">epoll / kqueue loop</text>
    <text class="s" x="288" y="100">multiplexes every</text>
    <text class="s" x="288" y="116">connection</text>

    <text class="lbl" x="508" y="37">BINLOGREADER THREAD</text>
    <text class="h" x="522" y="78">MySQL binlog</text>
    <text class="s" x="522" y="100">pushes row events</text>
    <text class="s" x="522" y="116">into the queue</text>

    <text class="lbl" x="742" y="37">BACKGROUND</text>
    <text class="h" x="756" y="78">Snapshot scheduler</text>
    <text class="s" x="756" y="100">periodic dump on</text>
    <text class="s" x="756" y="116"><tspan class="mono">dump.interval_sec</tspan></text>

    <text class="lbl" x="249" y="258">WORKER THREAD POOL</text>
    <text class="h" x="261" y="300">Query</text>
    <text class="s" x="261" y="322">concurrent</text>
    <text class="s" x="261" y="338">reads</text>
    <text class="h" x="403" y="300">Query</text>
    <text class="s" x="403" y="322">concurrent</text>
    <text class="s" x="403" y="338">reads</text>
    <text class="h" x="545" y="300">Event apply</text>
    <text class="s" x="545" y="322">Index + DocStore</text>
    <text class="s" x="545" y="338">writes</text>

    <text class="h" x="455" y="454" text-anchor="middle">Index + DocStore</text>
    <text class="s" x="455" y="476" text-anchor="middle"><tspan class="mono">shared_mutex</tspan> — many readers, one writer</text>

    <text class="s" x="373" y="196">dispatch</text>
    <text class="s" x="607" y="208">event queue</text>

    <text class="s" x="480" y="528" text-anchor="middle">Searches never block each other. Only the event-apply worker takes the write lock, and only while a row event is applied.</text>
  </g>

  <g data-i18n="ja">
    <text class="lbl" x="40" y="37">メインスレッド</text>
    <text class="h" x="54" y="68">初期化</text>
    <text class="s" x="54" y="86">設定・スナップショット読込</text>
    <text class="h" x="54" y="126">オーケストレータ</text>
    <text class="s" x="54" y="144">ライフサイクル管理</text>

    <text class="lbl" x="274" y="37">REACTOR スレッド</text>
    <text class="h" x="288" y="78">epoll / kqueue ループ</text>
    <text class="s" x="288" y="100">すべての接続を</text>
    <text class="s" x="288" y="116">多重化して監視</text>

    <text class="lbl" x="508" y="37">BINLOGREADER スレッド</text>
    <text class="h" x="522" y="78">MySQL binlog</text>
    <text class="s" x="522" y="100">行イベントを</text>
    <text class="s" x="522" y="116">キューへ積む</text>

    <text class="lbl" x="742" y="37">バックグラウンド</text>
    <text class="h" x="756" y="78">スナップショット</text>
    <text class="s" x="756" y="100"><tspan class="mono">dump.interval_sec</tspan> ごとに</text>
    <text class="s" x="756" y="116">定期ダンプ</text>

    <text class="lbl" x="249" y="258">ワーカースレッドプール</text>
    <text class="h" x="261" y="300">クエリ実行</text>
    <text class="s" x="261" y="322">並列に</text>
    <text class="s" x="261" y="338">読み取り</text>
    <text class="h" x="403" y="300">クエリ実行</text>
    <text class="s" x="403" y="322">並列に</text>
    <text class="s" x="403" y="338">読み取り</text>
    <text class="h" x="545" y="300">イベント適用</text>
    <text class="s" x="545" y="322">Index + DocStore</text>
    <text class="s" x="545" y="338">への書き込み</text>

    <text class="h" x="455" y="454" text-anchor="middle">Index + DocStore</text>
    <text class="s" x="455" y="476" text-anchor="middle"><tspan class="mono">shared_mutex</tspan> — 読み手は多数、書き手は1つ</text>

    <text class="s" x="373" y="196">ディスパッチ</text>
    <text class="s" x="607" y="208">イベントキュー</text>

    <text class="s" x="480" y="528" text-anchor="middle">検索同士が互いをブロックすることはありません。書き込みロックを取るのはイベント適用ワーカーだけで、しかも適用中のみです。</text>
  </g>
</svg>
