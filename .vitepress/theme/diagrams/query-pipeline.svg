<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 516" role="img">
  <title>Query execution pipeline</title>
  <defs>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <rect class="grp" x="24" y="56" width="912" height="388" rx="8"/>
  <rect class="chip" x="40" y="100" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="142" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="184" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="226" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="268" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="310" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="352" width="880" height="34" rx="5"/>
  <rect class="chip" x="40" y="394" width="880" height="34" rx="5"/>
  <rect class="grp" x="500" y="155" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="155" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="155" width="400" height="8" rx="4"/>
  <rect class="grp" x="500" y="197" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="197" width="208" height="8" rx="4"/>
  <rect class="fill1" x="500" y="197" width="208" height="8" rx="4"/>
  <rect class="grp" x="500" y="239" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="239" width="176" height="8" rx="4"/>
  <rect class="fill1" x="500" y="239" width="176" height="8" rx="4"/>
  <rect class="grp" x="500" y="281" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="281" width="104" height="8" rx="4"/>
  <rect class="fill1" x="500" y="281" width="104" height="8" rx="4"/>
  <rect class="grp" x="500" y="323" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="323" width="104" height="8" rx="4"/>
  <rect class="fill1" x="500" y="323" width="104" height="8" rx="4"/>
  <rect class="grp" x="500" y="365" width="400" height="8" rx="4"/>
  <rect class="fill1" x="500" y="365" width="28" height="8" rx="4"/>
  <rect class="fill1" x="500" y="365" width="28" height="8" rx="4"/>
  <rect class="grp" x="500" y="407" width="400" height="8" rx="4"/>
  <rect class="fill2" x="500" y="407" width="28" height="8" rx="4"/>
  <rect class="fill2" x="500" y="407" width="28" height="8" rx="4"/>

  <!-- language-neutral text -->
  <text class="s" x="250" y="121">—</text>
  <text class="mono" x="250" y="163">candidates</text>
  <text class="mono" x="250" y="205">after_intersection</text>
  <text class="mono" x="250" y="247">after_not</text>
  <text class="mono" x="250" y="289">after_filters</text>
  <text class="h" x="56" y="373">OFFSET / LIMIT</text>

  <g data-i18n="en">
    <text class="h" x="24" y="38">Query execution pipeline</text>
    <text class="lbl" x="56" y="84">stage</text>
    <text class="lbl" x="250" y="84">DEBUG field · note</text>
    <text class="lbl" x="500" y="84">candidate set</text>
    <text class="h" x="56" y="121">parse</text>
    <text class="h" x="56" y="163">n-gram lookup</text>
    <text class="h" x="56" y="205">AND intersection</text>
    <text class="h" x="56" y="247">NOT exclusion</text>
    <text class="h" x="56" y="289">FILTER application</text>
    <text class="h" x="56" y="331">SORT</text>
    <text class="h" x="56" y="415">results</text>
    <text class="s" x="500" y="121">query text becomes an AST</text>
    <text class="s" x="250" y="331"><tspan class="mono">partial_sort</tspan> if K &lt; 50%</text>
    <text class="s" x="250" y="373">large OFFSET still scans</text>
    <text class="s" x="250" y="415">returned to the client</text>
    <text class="s" x="24" y="472">DEBUG reports the candidate count after each stage — the field names above are what it prints.</text>
    <text class="s" x="24" y="494">Put the most restrictive term first: filters narrow an existing candidate set, they cannot seed one.</text>
  </g>

  <g data-i18n="ja">
    <text class="h" x="24" y="38">クエリ実行パイプライン</text>
    <text class="lbl" x="56" y="84">段階</text>
    <text class="lbl" x="250" y="84">DEBUG のフィールド・補足</text>
    <text class="lbl" x="500" y="84">候補集合の大きさ</text>
    <text class="h" x="56" y="121">解析</text>
    <text class="h" x="56" y="163">N-gram 参照</text>
    <text class="h" x="56" y="205">AND 積集合</text>
    <text class="h" x="56" y="247">NOT 除外</text>
    <text class="h" x="56" y="289">FILTER 適用</text>
    <text class="h" x="56" y="331">ソート</text>
    <text class="h" x="56" y="415">結果</text>
    <text class="s" x="500" y="121">クエリ文字列を AST に変換</text>
    <text class="s" x="250" y="331">K &lt; 50% なら <tspan class="mono">partial_sort</tspan></text>
    <text class="s" x="250" y="373">読み飛ばす分も走査する</text>
    <text class="s" x="250" y="415">クライアントへ返却</text>
    <text class="s" x="24" y="472">DEBUG は各段階の候補件数を出力します。上のフィールド名がそのまま出力されるキーです。</text>
    <text class="s" x="24" y="494">最も絞り込みの効く語を先頭に置いてください。フィルタは既存の候補を狭めるだけで、候補を作り出すことはできません。</text>
  </g>
</svg>
