<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 396" role="img">
  <title>Live replication sequence</title>
  <defs>
    <marker id="lr-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="lr-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- lifelines -->
  <path class="seam" d="M 160 64 V 336"/>
  <path class="seam" d="M 480 64 V 336"/>
  <path class="seam" d="M 800 64 V 336"/>
  <rect class="alt" x="80" y="24" width="160" height="40" rx="8"/>
  <rect class="card" x="400" y="24" width="160" height="40" rx="8"/>
  <rect class="card" x="720" y="24" width="160" height="40" rx="8"/>

  <!-- note on the queue -->
  <rect class="chip" x="320" y="128" width="320" height="48" rx="5"/>

  <!-- messages -->
  <path class="ln2" d="M 162 104 H 478" marker-end="url(#lr-b)"/>
  <path class="ln" d="M 482 208 H 798" marker-end="url(#lr-a)"/>
  <path class="ln" d="M 802 252 H 856 V 276 H 804" marker-end="url(#lr-a)"/>
  <path class="ln" d="M 802 296 H 856 V 320 H 804" marker-end="url(#lr-a)"/>

  <!-- language-neutral text -->
  <text class="h" x="160" y="49" text-anchor="middle">MySQL</text>
  <text class="mono" x="336" y="168">replication.queue_size</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="h" x="480" y="49" text-anchor="middle">Event queue</text>
    <text class="h" x="800" y="49" text-anchor="middle">Worker</text>
    <text class="s" x="320" y="96" text-anchor="middle">row events (INSERT / UPDATE / DELETE)</text>
    <text class="s" x="336" y="150">bounded queue —</text>
    <text class="s" x="484" y="168">(default 10,000)</text>
    <text class="s" x="640" y="200" text-anchor="middle">dequeue one event</text>
    <text class="s" x="788" y="268" text-anchor="end">update Index + DocStore</text>
    <text class="s" x="788" y="312" text-anchor="end">invalidate affected cache entries</text>
    <text class="s" x="480" y="372" text-anchor="middle">The queue is bounded on purpose: if workers fall behind, the reader blocks instead of growing memory without limit.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="h" x="480" y="49" text-anchor="middle">イベントキュー</text>
    <text class="h" x="800" y="49" text-anchor="middle">ワーカー</text>
    <text class="s" x="320" y="96" text-anchor="middle">行イベント（INSERT / UPDATE / DELETE）</text>
    <text class="s" x="336" y="150">上限付きキュー —</text>
    <text class="s" x="484" y="168">（デフォルト 10,000）</text>
    <text class="s" x="640" y="200" text-anchor="middle">イベントを1件取り出す</text>
    <text class="s" x="788" y="268" text-anchor="end">Index + DocStore を更新</text>
    <text class="s" x="788" y="312" text-anchor="end">影響するキャッシュを無効化</text>
    <text class="s" x="480" y="372" text-anchor="middle">キューに上限があるのは意図的です。ワーカーが遅れた場合、メモリを際限なく増やす代わりにリーダー側が待機します。</text>
  </g>
</svg>
