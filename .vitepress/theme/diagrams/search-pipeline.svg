<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 404" role="img">
  <title>Search pipeline stages</title>
  <defs>
    <marker id="sp-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <rect class="grp" x="24" y="48" width="912" height="122" rx="8"/>
  <rect class="grp" x="24" y="210" width="912" height="122" rx="8"/>
  <rect class="chip" x="40" y="64" width="160" height="90" rx="5"/>
  <rect class="chip" x="220" y="64" width="160" height="90" rx="5"/>
  <rect class="chip" x="400" y="64" width="160" height="90" rx="5"/>
  <rect class="chip" x="580" y="64" width="160" height="90" rx="5"/>
  <rect class="chip" x="760" y="64" width="160" height="90" rx="5"/>
  <rect class="chip" x="40" y="226" width="160" height="90" rx="5"/>
  <rect class="chip" x="220" y="226" width="160" height="90" rx="5"/>
  <rect class="chip" x="400" y="226" width="160" height="90" rx="5"/>
  <rect class="chip" x="580" y="226" width="160" height="90" rx="5"/>
  <rect class="card" x="760" y="226" width="160" height="90" rx="5"/>

  <path class="ln" d="M201 109 H219" marker-end="url(#sp-a)"/>
  <path class="ln" d="M381 109 H399" marker-end="url(#sp-a)"/>
  <path class="ln" d="M561 109 H579" marker-end="url(#sp-a)"/>
  <path class="ln" d="M741 109 H759" marker-end="url(#sp-a)"/>
  <path class="ln" d="M201 271 H219" marker-end="url(#sp-a)"/>
  <path class="ln" d="M381 271 H399" marker-end="url(#sp-a)"/>
  <path class="ln" d="M561 271 H579" marker-end="url(#sp-a)"/>
  <path class="ln" d="M741 271 H759" marker-end="url(#sp-a)"/>
  <path class="ln" d="M840 154 V190 H120 V225" marker-end="url(#sp-a)"/>

  <!-- language-neutral text -->
  <text class="lbl" x="54" y="84">01</text>
  <text class="lbl" x="234" y="84">02</text>
  <text class="lbl" x="414" y="84">03</text>
  <text class="lbl" x="594" y="84">04</text>
  <text class="lbl" x="774" y="84">05</text>
  <text class="lbl" x="54" y="246">06</text>
  <text class="lbl" x="234" y="246">07</text>
  <text class="lbl" x="414" y="246">08</text>
  <text class="lbl" x="594" y="246">09</text>
  <text class="lbl" x="774" y="246">10</text>
  <text class="mono" x="120" y="128" text-anchor="middle">"quantum physics"</text>
  <text class="mono" x="300" y="270" text-anchor="middle">verify_text</text>
  <text class="h" x="660" y="270" text-anchor="middle">OFFSET / LIMIT</text>

  <g data-i18n="en">
    <text class="h" x="120" y="108" text-anchor="middle">Client query</text>
    <text class="h" x="300" y="108" text-anchor="middle">Parse</text>
    <text class="s" x="300" y="128" text-anchor="middle">terms, clauses, AST</text>
    <text class="h" x="480" y="108" text-anchor="middle">Generate n-grams</text>
    <text class="s" x="480" y="128" text-anchor="middle">rarest term first,</text>
    <text class="s" x="480" y="144" text-anchor="middle">after NFKC normalization</text>
    <text class="h" x="660" y="108" text-anchor="middle">Intersect postings</text>
    <text class="s" x="660" y="128" text-anchor="middle">AND across n-grams</text>
    <text class="h" x="840" y="108" text-anchor="middle">NOT filter</text>
    <text class="s" x="840" y="128" text-anchor="middle">remove excluded</text>
    <text class="h" x="120" y="270" text-anchor="middle">Column filters</text>
    <text class="s" x="120" y="290" text-anchor="middle">FILTER clauses</text>
    <text class="s" x="300" y="290" text-anchor="middle">drop false positives</text>
    <text class="s" x="300" y="306" text-anchor="middle">— only when enabled</text>
    <text class="h" x="480" y="270" text-anchor="middle">Sort</text>
    <text class="s" x="480" y="290" text-anchor="middle">primary key or _score</text>
    <text class="s" x="660" y="290" text-anchor="middle">applied last</text>
    <text class="h" x="840" y="270" text-anchor="middle">Return DocIDs</text>
    <text class="s" x="840" y="290" text-anchor="middle">+ optional snippets</text>
    <text class="s" x="480" y="362" text-anchor="middle">The candidate set only ever shrinks from step 4 onward, so the cheapest filters run before the expensive ones.</text>
    <text class="s" x="480" y="384" text-anchor="middle">Step 7 checks stored text only when enabled; highlighting and scoring can read it too.</text>
  </g>

  <g data-i18n="ja">
    <text class="h" x="120" y="108" text-anchor="middle">クライアントクエリ</text>
    <text class="h" x="300" y="108" text-anchor="middle">解析</text>
    <text class="s" x="300" y="128" text-anchor="middle">検索語・句・AST</text>
    <text class="h" x="480" y="108" text-anchor="middle">N-gram 生成</text>
    <text class="s" x="480" y="128" text-anchor="middle">NFKC 正規化のうえ</text>
    <text class="s" x="480" y="144" text-anchor="middle">希少な語から順に</text>
    <text class="h" x="660" y="108" text-anchor="middle">ポスティング積集合</text>
    <text class="s" x="660" y="128" text-anchor="middle">N-gram 間で AND</text>
    <text class="h" x="840" y="108" text-anchor="middle">NOT 除外</text>
    <text class="s" x="840" y="128" text-anchor="middle">対象を取り除く</text>
    <text class="h" x="120" y="270" text-anchor="middle">カラムフィルタ</text>
    <text class="s" x="120" y="290" text-anchor="middle">FILTER 句</text>
    <text class="s" x="300" y="290" text-anchor="middle">偽陽性を除去</text>
    <text class="s" x="300" y="306" text-anchor="middle">— 有効時のみ</text>
    <text class="h" x="480" y="270" text-anchor="middle">ソート</text>
    <text class="s" x="480" y="290" text-anchor="middle">主キー または _score</text>
    <text class="s" x="660" y="290" text-anchor="middle">最後に適用</text>
    <text class="h" x="840" y="270" text-anchor="middle">DocID を返却</text>
    <text class="s" x="840" y="290" text-anchor="middle">+ 任意でスニペット</text>
    <text class="s" x="480" y="362" text-anchor="middle">4番以降、候補集合は縮む一方です。そのため、安価なフィルタほど先に実行されます。</text>
    <text class="s" x="480" y="384" text-anchor="middle">7番の照合は有効時のみ。ハイライトやスコアリングでも保存テキストを読みます。</text>
  </g>
</svg>
