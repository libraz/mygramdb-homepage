<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 424" role="img">
  <title>High availability topology</title>
  <defs>
    <marker id="ha-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="ha-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- shapes -->
  <rect class="alt" x="340" y="24" width="280" height="56" rx="8"/>
  <rect class="grp" x="24" y="132" width="912" height="108" rx="8"/>
  <rect class="card" x="40" y="148" width="280" height="76" rx="8"/>
  <rect class="card" x="340" y="148" width="280" height="76" rx="8"/>
  <rect class="card" x="640" y="148" width="280" height="76" rx="8"/>
  <rect class="chip" x="340" y="292" width="280" height="56" rx="8"/>
  <rect class="chip" x="736" y="292" width="200" height="56" rx="8"/>

  <!-- edges -->
  <path class="ln2" d="M 480 80 V 106 H 180 V 146" marker-end="url(#ha-b)"/>
  <path class="ln2" d="M 480 80 V 146" marker-end="url(#ha-b)"/>
  <path class="ln2" d="M 480 80 V 106 H 780 V 146" marker-end="url(#ha-b)"/>
  <path class="ln" d="M 180 224 V 258 H 400 V 292"/>
  <path class="ln" d="M 480 224 V 292"/>
  <path class="ln" d="M 780 224 V 258 H 560 V 292"/>
  <path class="ln" d="M 620 320 H 736"/>

  <!-- language-neutral text -->
  <text class="mono" x="56" y="202">server_id 83917</text>
  <text class="mono" x="356" y="202">server_id 83918</text>
  <text class="mono" x="656" y="202">server_id 83919</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="h" x="356" y="48">MySQL primary</text>
    <text class="s" x="356" y="66">the only writable copy</text>
    <text class="s" x="330" y="98" text-anchor="middle">binlog replication</text>
    <text class="h" x="56" y="176">MygramDB node 1</text>
    <text class="h" x="356" y="176">MygramDB node 2</text>
    <text class="h" x="656" y="176">MygramDB node 3</text>
    <text class="h" x="356" y="316">Load balancer</text>
    <text class="s" x="356" y="334">route on /health/ready</text>
    <text class="h" x="752" y="316">Application</text>
    <text class="s" x="752" y="334">search traffic</text>
    <text class="s" x="480" y="380" text-anchor="middle">Each node is a full independent replica, not a shard — every node can answer every query.</text>
    <text class="s" x="480" y="402" text-anchor="middle">Give each one a distinct server_id, and gate the load balancer on /health/ready so a syncing node receives no traffic.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="h" x="356" y="48">MySQL プライマリ</text>
    <text class="s" x="356" y="66">書き込みができる唯一の正</text>
    <text class="s" x="330" y="98" text-anchor="middle">binlog レプリケーション</text>
    <text class="h" x="56" y="176">MygramDB ノード 1</text>
    <text class="h" x="356" y="176">MygramDB ノード 2</text>
    <text class="h" x="656" y="176">MygramDB ノード 3</text>
    <text class="h" x="356" y="316">ロードバランサ</text>
    <text class="s" x="356" y="334">/health/ready で振り分け</text>
    <text class="h" x="752" y="316">アプリケーション</text>
    <text class="s" x="752" y="334">検索トラフィック</text>
    <text class="s" x="480" y="380" text-anchor="middle">各ノードはシャードではなく独立した完全なレプリカで、どのノードでもすべてのクエリに応答できます。</text>
    <text class="s" x="480" y="402" text-anchor="middle">server_id はノードごとに変え、ロードバランサは /health/ready で判定して同期中のノードへ流さないようにします。</text>
  </g>
</svg>
