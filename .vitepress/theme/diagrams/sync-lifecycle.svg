<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 476" role="img">
  <title>SYNC lifecycle and table availability</title>
  <defs>
    <marker id="sl-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sl-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="sl-w" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="warnt" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <rect class="warn" x="370" y="24" width="300" height="48" rx="8"/>
  <path class="warn" d="M520 72 V103" marker-end="url(#sl-w)"/>

  <rect class="card" x="40" y="104" width="108" height="76" rx="5"/>
  <rect class="chip" x="260" y="104" width="150" height="76" rx="5"/>
  <rect class="card" x="440" y="104" width="160" height="76" rx="5"/>
  <rect class="chip" x="630" y="104" width="96" height="76" rx="5"/>
  <rect class="alt" x="756" y="104" width="164" height="76" rx="5"/>

  <path class="ln" d="M149 142 H259" marker-end="url(#sl-a)"/>
  <path class="ln" d="M411 142 H439" marker-end="url(#sl-a)"/>
  <path class="ln" d="M601 142 H629" marker-end="url(#sl-a)"/>
  <path class="ln2" d="M727 142 H755" marker-end="url(#sl-b)"/>

  <path class="warn" d="M335 181 V223" marker-end="url(#sl-w)"/>
  <rect class="warn" x="260" y="224" width="150" height="64" rx="5"/>
  <path class="ln" d="M520 181 V223" marker-end="url(#sl-a)"/>
  <rect class="chip" x="445" y="224" width="150" height="64" rx="5"/>

  <path class="ln2" d="M838 181 V203" marker-end="url(#sl-b)"/>
  <rect class="grp" x="740" y="204" width="196" height="126" rx="8"/>
  <rect class="chip" x="756" y="220" width="164" height="26" rx="5"/>
  <rect class="chip" x="756" y="254" width="164" height="26" rx="5"/>
  <rect class="warn" x="756" y="288" width="164" height="26" rx="5"/>
  <path class="ln" d="M838 331 V349" marker-end="url(#sl-a)"/>
  <rect class="card" x="756" y="350" width="164" height="64" rx="5"/>

  <rect class="warn" x="40" y="350" width="640" height="64" rx="8"/>

  <!-- language-neutral text -->
  <text class="mono" x="94" y="134" text-anchor="middle">READY</text>
  <text class="mono" x="204" y="134" text-anchor="middle">SYNC &lt;db.table&gt;</text>
  <text class="mono" x="520" y="128" text-anchor="middle">IN_PROGRESS</text>
  <text class="mono" x="335" y="252" text-anchor="middle">FAILED</text>
  <text class="mono" x="528" y="208">SIGTERM</text>
  <text class="mono" x="520" y="252" text-anchor="middle">CANCELLED</text>
  <text class="mono" x="838" y="237" text-anchor="middle">STARTED</text>
  <text class="mono" x="838" y="271" text-anchor="middle">DISABLED</text>
  <text class="mono warnt" x="838" y="305" text-anchor="middle">FAILED</text>
  <text class="mono" x="838" y="376" text-anchor="middle">COMPLETED</text>

  <g data-i18n="en">
    <text class="warnt" x="520" y="44" text-anchor="middle">HTTP search / count / facet / get</text>
    <text class="warnt" x="520" y="60" text-anchor="middle">return 503 for this table</text>
    <text class="s" x="94" y="154" text-anchor="middle">serving queries</text>
    <text class="h" x="335" y="146" text-anchor="middle">memory-health check</text>
    <text class="s" x="520" y="148" text-anchor="middle">snapshot built from</text>
    <text class="s" x="520" y="164" text-anchor="middle">a MySQL SELECT</text>
    <text class="h" x="678" y="146" text-anchor="middle">GTID saved</text>
    <text class="h" x="838" y="128" text-anchor="middle">replication starts</text>
    <text class="s" x="838" y="148" text-anchor="middle">automatically, from</text>
    <text class="s" x="838" y="164" text-anchor="middle">the saved GTID</text>
    <text class="warnt" x="343" y="208">fail</text>
    <text class="s" x="335" y="272" text-anchor="middle">table stays READY</text>
    <text class="s" x="520" y="272" text-anchor="middle">graceful shutdown</text>
    <text class="s" x="838" y="396" text-anchor="middle">table returns to READY</text>
    <text class="h" x="60" y="376">Mutual exclusion</text>
    <text class="s" x="60" y="396">SYNC is rejected while OPTIMIZE or DUMP SAVE / LOAD runs, and vice versa</text>
    <text class="s" x="480" y="452" text-anchor="middle">Treat a 503 during IN_PROGRESS as retry-after-readiness, not as an error.</text>
  </g>

  <g data-i18n="ja">
    <text class="warnt" x="520" y="44" text-anchor="middle">HTTP の search / count / facet / get が</text>
    <text class="warnt" x="520" y="60" text-anchor="middle">このテーブルについて 503 を返す</text>
    <text class="s" x="94" y="154" text-anchor="middle">検索を受付中</text>
    <text class="h" x="335" y="146" text-anchor="middle">メモリ健全性チェック</text>
    <text class="s" x="520" y="148" text-anchor="middle">MySQL の SELECT から</text>
    <text class="s" x="520" y="164" text-anchor="middle">スナップショットを構築</text>
    <text class="h" x="678" y="146" text-anchor="middle">GTID を保存</text>
    <text class="h" x="838" y="128" text-anchor="middle">レプリケーション開始</text>
    <text class="s" x="838" y="148" text-anchor="middle">保存した GTID から</text>
    <text class="s" x="838" y="164" text-anchor="middle">自動で再開</text>
    <text class="warnt" x="343" y="208">失敗</text>
    <text class="s" x="335" y="272" text-anchor="middle">READY のまま</text>
    <text class="s" x="520" y="272" text-anchor="middle">正常なシャットダウン</text>
    <text class="s" x="838" y="396" text-anchor="middle">テーブルは READY へ戻る</text>
    <text class="h" x="60" y="376">相互排他</text>
    <text class="s" x="60" y="396">OPTIMIZE や DUMP SAVE / LOAD の実行中は SYNC を受け付けません（逆も同様）</text>
    <text class="s" x="480" y="452" text-anchor="middle">IN_PROGRESS 中の 503 はエラーではなく、準備完了後に再試行する合図として扱ってください。</text>
  </g>
</svg>
