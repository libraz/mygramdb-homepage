<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 356" role="img">
  <title>Per-table memory layout</title>
  <defs>
    <marker id="ml-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="ml-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- groups -->
  <rect class="grp" x="24" y="24" width="664" height="284" rx="8"/>
  <rect class="grp" x="704" y="24" width="232" height="284" rx="8"/>

  <!-- chips -->
  <rect class="chip" x="40" y="88" width="200" height="96" rx="5"/>
  <rect class="chip" x="40" y="196" width="200" height="96" rx="5"/>
  <rect class="chip" x="256" y="88" width="200" height="96" rx="5"/>
  <rect class="chip" x="256" y="196" width="200" height="96" rx="5"/>
  <rect class="chip" x="472" y="88" width="200" height="204" rx="5"/>
  <rect class="chip" x="720" y="88" width="200" height="96" rx="5"/>
  <rect class="chip" x="720" y="196" width="200" height="96" rx="5"/>

  <!-- language-neutral text -->
  <text class="lbl" x="40" y="76">INDEX</text>
  <text class="lbl" x="256" y="76">DOCUMENTSTORE</text>
  <text class="mono" x="56" y="134">string → PostingList</text>
  <text class="mono" x="56" y="278">memory.roaring_threshold</text>
  <text class="mono" x="488" y="198">memory.verify_text</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="h" x="56" y="112">N-gram map</text>
    <text class="mono" x="736" y="134">query digest → result set</text>
    <text class="mono" x="736" y="242">n-gram → cache entries</text>
    <text class="lbl" x="40" y="46">PER-TABLE MEMORY</text>
    <text class="lbl" x="720" y="46">SHARED CACHE</text>
    <text class="lbl" x="472" y="76">STORED TEXT</text>
    <text class="s" x="56" y="156">one entry per distinct</text>
    <text class="s" x="56" y="171">n-gram in the table</text>
    <text class="h" x="56" y="220">PostingList</text>
    <text class="s" x="56" y="242">delta-encoded when sparse,</text>
    <text class="s" x="56" y="257">Roaring bitmap when dense</text>
    <text class="h" x="272" y="112">DocID → primary key</text>
    <text class="s" x="272" y="134">what a search actually</text>
    <text class="s" x="272" y="149">returns to the client</text>
    <text class="h" x="272" y="220">Filter columns</text>
    <text class="s" x="272" y="242">category, status, timestamps</text>
    <text class="s" x="272" y="257">— only what the config</text>
    <text class="s" x="272" y="272">declares as a filter</text>
    <text class="h" x="488" y="112">DocID → text</text>
    <text class="s" x="488" y="134">normalized text retained for</text>
    <text class="s" x="488" y="149">highlighting and BM25;</text>
    <text class="s" x="488" y="164">verification when enabled</text>
    <text class="s" x="488" y="222">controls post-filtering,</text>
    <text class="s" x="488" y="237">not whether text is stored</text>
    <text class="h" x="736" y="112">Query cache</text>
    <text class="s" x="736" y="156">only queries slower than</text>
    <text class="s" x="736" y="171">cache.min_query_cost_ms</text>
    <text class="h" x="736" y="220">Reverse index</text>
    <text class="s" x="736" y="264">lets a changed row evict</text>
    <text class="s" x="736" y="279">only the affected queries</text>
    <text class="s" x="480" y="336" text-anchor="middle">Index and DocStore are per table. The cache is shared, which is why its invalidation has to be n-gram-precise.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="h" x="56" y="112">N-gram マップ</text>
    <text class="mono" x="736" y="134">クエリダイジェスト → 結果</text>
    <text class="mono" x="736" y="242">N-gram → キャッシュ項目</text>
    <text class="lbl" x="40" y="46">テーブルごとのメモリ</text>
    <text class="lbl" x="720" y="46">共有キャッシュ</text>
    <text class="lbl" x="472" y="76">保存テキスト</text>
    <text class="s" x="56" y="156">テーブル内の異なる</text>
    <text class="s" x="56" y="171">N-gram ごとに1エントリ</text>
    <text class="h" x="56" y="220">PostingList</text>
    <text class="s" x="56" y="242">疎ならデルタ符号化、</text>
    <text class="s" x="56" y="257">密なら Roaring Bitmap</text>
    <text class="h" x="272" y="112">DocID → 主キー</text>
    <text class="s" x="272" y="134">検索がクライアントへ</text>
    <text class="s" x="272" y="149">実際に返す値</text>
    <text class="h" x="272" y="220">フィルタカラム</text>
    <text class="s" x="272" y="242">category・status・日時など</text>
    <text class="s" x="272" y="257">設定でフィルタとして</text>
    <text class="s" x="272" y="272">宣言したものだけ</text>
    <text class="h" x="488" y="112">DocID → テキスト</text>
    <text class="s" x="488" y="134">ハイライト・BM25 用に</text>
    <text class="s" x="488" y="149">正規化テキストを保持</text>
    <text class="s" x="488" y="164">照合時もこのテキストを使用</text>
    <text class="s" x="488" y="222">制御するのは照合処理</text>
    <text class="s" x="488" y="237">テキスト保存は常に有効</text>
    <text class="h" x="736" y="112">クエリキャッシュ</text>
    <text class="s" x="736" y="156">対象は次より遅いクエリのみ</text>
    <text class="s" x="736" y="171">cache.min_query_cost_ms</text>
    <text class="h" x="736" y="220">逆引きインデックス</text>
    <text class="s" x="736" y="264">変更行が影響するクエリだけを</text>
    <text class="s" x="736" y="279">破棄できる</text>
    <text class="s" x="480" y="336" text-anchor="middle">Index と DocStore はテーブルごと。キャッシュは共有のため、無効化を N-gram 単位で精密に行う必要があります。</text>
  </g>
</svg>
