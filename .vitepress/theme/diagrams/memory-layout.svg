<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1120 520" role="img">
  <title>Per-table memory layout</title>
  <defs>
    <style>
      .dg{--fs:16px;
        --dgf:'IBM Plex Sans','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,system-ui,sans-serif;
        --dgm:'IBM Plex Mono','SF Mono',Consolas,monospace;
        --ink:var(--dg-ink,#0f172a);--txt:var(--dg-text,#334155);--mut:var(--dg-muted,#64748b);
        --ln:var(--dg-line,#475569);--gd:var(--dg-guide,#cbd5e1)}
      .dg text{font-family:var(--dgf);font-size:var(--fs);font-weight:500;fill:var(--txt)}
      .dg .t{font-size:calc(var(--fs)*1.06);font-weight:700;fill:var(--ink)}
      .dg .g{font-size:calc(var(--fs)*0.82);font-weight:700;fill:var(--mut);letter-spacing:.08em}
      .dg .s{font-size:calc(var(--fs)*0.8);fill:var(--mut)}
      .dg .m{font-family:var(--dgm);font-size:calc(var(--fs)*0.78);fill:var(--mut)}
      .dg .box{stroke-width:2}
      .dg .grp{fill:none;stroke:var(--gd);stroke-width:2;stroke-dasharray:5 5}
      .dg .blue{fill:var(--dg-blue-bg,#dbeafe);stroke:var(--dg-blue-br,#1d4ed8)}
      .dg .sky{fill:var(--dg-sky-bg,#e0f2fe);stroke:var(--dg-sky-br,#0369a1)}
      .dg .slate{fill:var(--dg-slate-bg,#f1f5f9);stroke:var(--dg-slate-br,#64748b)}
      .dg .amber{fill:var(--dg-amber-bg,#fef3c7);stroke:var(--dg-amber-br,#b45309)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- outer groups -->
  <rect class="grp" x="24" y="60" width="740" height="382" rx="14"/>
  <rect class="grp" x="800" y="60" width="296" height="382" rx="14"/>

  <!-- index column -->
  <rect class="box blue" x="46" y="132" width="222" height="126" rx="10"/>
  <rect class="box blue" x="46" y="278" width="222" height="146" rx="10"/>
  <!-- docstore column -->
  <rect class="box sky" x="288" y="132" width="222" height="126" rx="10"/>
  <rect class="box sky" x="288" y="278" width="222" height="146" rx="10"/>
  <!-- text store column -->
  <rect class="box amber" x="530" y="132" width="212" height="292" rx="10"/>
  <!-- cache -->
  <rect class="box slate" x="822" y="132" width="252" height="126" rx="10"/>
  <rect class="box slate" x="822" y="278" width="252" height="146" rx="10"/>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="g" x="394" y="86" text-anchor="middle">PER-TABLE MEMORY</text>
    <text class="g" x="948" y="86" text-anchor="middle">SHARED CACHE</text>

    <text class="g" x="157" y="118" text-anchor="middle">INDEX</text>
    <text class="t" x="157" y="166" text-anchor="middle">N-gram map</text>
    <text class="m" x="157" y="194" text-anchor="middle">string → PostingList</text>
    <text class="s" x="157" y="224" text-anchor="middle">one entry per distinct</text>
    <text class="s" x="157" y="244" text-anchor="middle">n-gram in the table</text>

    <text class="t" x="157" y="312" text-anchor="middle">PostingList</text>
    <text class="s" x="157" y="342" text-anchor="middle">delta-encoded when sparse,</text>
    <text class="s" x="157" y="362" text-anchor="middle">Roaring bitmap when dense</text>
    <text class="m" x="157" y="394" text-anchor="middle">memory.roaring_threshold</text>

    <text class="g" x="399" y="118" text-anchor="middle">DOCUMENTSTORE</text>
    <text class="t" x="399" y="166" text-anchor="middle">DocID → primary key</text>
    <text class="s" x="399" y="200" text-anchor="middle">what a search actually</text>
    <text class="s" x="399" y="220" text-anchor="middle">returns to the client</text>

    <text class="t" x="399" y="312" text-anchor="middle">Filter columns</text>
    <text class="s" x="399" y="342" text-anchor="middle">category, status, timestamps</text>
    <text class="s" x="399" y="366" text-anchor="middle">— only what the config</text>
    <text class="s" x="399" y="386" text-anchor="middle">declares as a filter</text>

    <text class="g" x="636" y="118" text-anchor="middle">TEXT STORE — OPTIONAL</text>
    <text class="t" x="636" y="182" text-anchor="middle">DocID → text</text>
    <text class="s" x="636" y="216" text-anchor="middle">normalized text kept for</text>
    <text class="s" x="636" y="238" text-anchor="middle">candidate verification,</text>
    <text class="s" x="636" y="260" text-anchor="middle">highlighting and BM25</text>
    <text class="m" x="636" y="298" text-anchor="middle">memory.verify_text</text>
    <text class="s" x="636" y="336" text-anchor="middle">Roughly triples per-document</text>
    <text class="s" x="636" y="358" text-anchor="middle">memory: ~813 MB → ~3.1 GB</text>
    <text class="s" x="636" y="380" text-anchor="middle">per million documents</text>

    <text class="t" x="948" y="166" text-anchor="middle">Query cache</text>
    <text class="m" x="948" y="194" text-anchor="middle">query digest → result set</text>
    <text class="s" x="948" y="226" text-anchor="middle">only queries slower than</text>
    <text class="s" x="948" y="246" text-anchor="middle">cache.min_query_cost_ms</text>

    <text class="t" x="948" y="312" text-anchor="middle">Reverse index</text>
    <text class="m" x="948" y="340" text-anchor="middle">n-gram → cache entries</text>
    <text class="s" x="948" y="372" text-anchor="middle">lets a changed row evict</text>
    <text class="s" x="948" y="392" text-anchor="middle">only the affected queries</text>

    <text class="s" x="560" y="486" text-anchor="middle">Index and DocStore are per table. The cache is shared, which is why its invalidation has to be n-gram-precise.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="g" x="394" y="86" text-anchor="middle">テーブルごとのメモリ</text>
    <text class="g" x="948" y="86" text-anchor="middle">共有キャッシュ</text>

    <text class="g" x="157" y="118" text-anchor="middle">INDEX</text>
    <text class="t" x="157" y="166" text-anchor="middle">N-gram マップ</text>
    <text class="m" x="157" y="194" text-anchor="middle">string → PostingList</text>
    <text class="s" x="157" y="224" text-anchor="middle">テーブル内の異なる</text>
    <text class="s" x="157" y="244" text-anchor="middle">N-gram ごとに1エントリ</text>

    <text class="t" x="157" y="312" text-anchor="middle">PostingList</text>
    <text class="s" x="157" y="342" text-anchor="middle">疎ならデルタ符号化、</text>
    <text class="s" x="157" y="362" text-anchor="middle">密なら Roaring Bitmap</text>
    <text class="m" x="157" y="394" text-anchor="middle">memory.roaring_threshold</text>

    <text class="g" x="399" y="118" text-anchor="middle">DOCUMENTSTORE</text>
    <text class="t" x="399" y="166" text-anchor="middle">DocID → 主キー</text>
    <text class="s" x="399" y="200" text-anchor="middle">検索がクライアントへ</text>
    <text class="s" x="399" y="220" text-anchor="middle">実際に返す値</text>

    <text class="t" x="399" y="312" text-anchor="middle">フィルタカラム</text>
    <text class="s" x="399" y="342" text-anchor="middle">category・status・日時など</text>
    <text class="s" x="399" y="366" text-anchor="middle">設定でフィルタとして</text>
    <text class="s" x="399" y="386" text-anchor="middle">宣言したものだけ</text>

    <text class="g" x="636" y="118" text-anchor="middle">テキストストア（任意）</text>
    <text class="t" x="636" y="182" text-anchor="middle">DocID → テキスト</text>
    <text class="s" x="636" y="216" text-anchor="middle">候補の照合・ハイライト・</text>
    <text class="s" x="636" y="238" text-anchor="middle">BM25 のために</text>
    <text class="s" x="636" y="260" text-anchor="middle">正規化テキストを保持</text>
    <text class="m" x="636" y="298" text-anchor="middle">memory.verify_text</text>
    <text class="s" x="636" y="336" text-anchor="middle">1件あたりのメモリは約3倍。</text>
    <text class="s" x="636" y="358" text-anchor="middle">100万件あたり約813MB →</text>
    <text class="s" x="636" y="380" text-anchor="middle">約3.1GB</text>

    <text class="t" x="948" y="166" text-anchor="middle">クエリキャッシュ</text>
    <text class="m" x="948" y="194" text-anchor="middle">クエリダイジェスト → 結果</text>
    <text class="s" x="948" y="226" text-anchor="middle">対象は次より遅いクエリのみ</text>
    <text class="s" x="948" y="246" text-anchor="middle">cache.min_query_cost_ms</text>

    <text class="t" x="948" y="312" text-anchor="middle">逆引きインデックス</text>
    <text class="m" x="948" y="340" text-anchor="middle">N-gram → キャッシュ項目</text>
    <text class="s" x="948" y="372" text-anchor="middle">変更行が影響するクエリだけを</text>
    <text class="s" x="948" y="392" text-anchor="middle">破棄できる</text>

    <text class="s" x="560" y="486" text-anchor="middle">Index と DocStore はテーブルごと。キャッシュは共有のため、無効化を N-gram 単位で精密に行う必要があります。</text>
  </g>
</svg>
