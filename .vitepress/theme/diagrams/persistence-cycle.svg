<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 332" role="img">
  <title>Snapshot-based persistence cycle</title>
  <defs>
    <marker id="pc-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="pc-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- groups -->
  <rect class="grp" x="24" y="24" width="336" height="196" rx="8"/>
  <rect class="grp" x="600" y="24" width="336" height="196" rx="8"/>

  <!-- chips -->
  <rect class="card" x="40" y="64" width="304" height="64" rx="5"/>
  <rect class="card" x="40" y="140" width="304" height="64" rx="5"/>
  <rect class="chip" x="616" y="64" width="304" height="140" rx="5"/>

  <!-- edges -->
  <path class="ln" d="M 344 96 H 614" marker-end="url(#pc-a)"/>
  <path class="ln" d="M 344 172 H 614" marker-end="url(#pc-a)"/>
  <path class="ln2 dash" d="M 768 204 V 268 H 192 V 206" marker-end="url(#pc-b)"/>

  <!-- language-neutral text -->
  <text class="h" x="56" y="90">Index + DocStore</text>
  <text class="mono" x="632" y="164">.dmp</text>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="lbl" x="40" y="46">RUNTIME (MEMORY)</text>
    <text class="s" x="56" y="110">everything queries read from</text>
    <text class="h" x="56" y="166">Current GTID position</text>
    <text class="s" x="56" y="186">how far the binlog has been read</text>
    <text class="lbl" x="616" y="46">DISK</text>
    <text class="h" x="632" y="90">Snapshot file</text>
    <text class="s" x="632" y="112">index + document store + GTID,</text>
    <text class="s" x="632" y="127">written to a temp file and renamed</text>
    <text class="s" x="480" y="88" text-anchor="middle">periodic dump</text>
    <text class="s" x="480" y="164" text-anchor="middle">saved with the snapshot</text>
    <text class="s" x="480" y="260" text-anchor="middle">DUMP LOAD, then replay the binlog from the saved GTID</text>
    <text class="s" x="480" y="308" text-anchor="middle">There is no write-ahead log. Recovery is the last snapshot plus catch-up from MySQL, so a lost dump costs time, not data.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="lbl" x="40" y="46">ランタイム（メモリ上）</text>
    <text class="s" x="56" y="110">検索が参照するすべてのデータ</text>
    <text class="h" x="56" y="166">現在の GTID 位置</text>
    <text class="s" x="56" y="186">binlog をどこまで読んだか</text>
    <text class="lbl" x="616" y="46">ディスク</text>
    <text class="h" x="632" y="90">スナップショットファイル</text>
    <text class="s" x="632" y="112">インデックス + ドキュメントストア + GTID。</text>
    <text class="s" x="632" y="127">一時ファイルに書いてから rename</text>
    <text class="s" x="480" y="88" text-anchor="middle">定期ダンプ</text>
    <text class="s" x="480" y="164" text-anchor="middle">スナップショットと一緒に保存</text>
    <text class="s" x="480" y="260" text-anchor="middle">DUMP LOAD 後、保存済み GTID から binlog を再適用</text>
    <text class="s" x="480" y="308" text-anchor="middle">WAL は持ちません。復旧は「最後のスナップショット + MySQL からの追いつき」なので、ダンプを失っても失うのは時間だけです。</text>
  </g>
</svg>
