<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1040 430" role="img">
  <title>MySQL FULLTEXT and MygramDB query paths</title>
  <defs>
    <marker id="qc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="var(--ln)"/>
    </marker>
    <style>
      .dg{--fs:16px;
        --dgf:'IBM Plex Sans','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,system-ui,sans-serif;
        --dgm:'IBM Plex Mono','SF Mono',Consolas,monospace;
        --ink:var(--dg-ink,#0f172a);--txt:var(--dg-text,#334155);--mut:var(--dg-muted,#64748b);
        --ln:var(--dg-line,#475569);--gd:var(--dg-guide,#cbd5e1);--rs:var(--dg-rose-br,#be123c)}
      .dg text{font-family:var(--dgf);font-size:var(--fs);font-weight:500;fill:var(--txt)}
      .dg .t{font-size:calc(var(--fs)*1.2);font-weight:700;fill:var(--ink)}
      .dg .l{font-size:calc(var(--fs)*1.18);font-weight:700}
      .dg .s{font-size:calc(var(--fs)*0.85);fill:var(--mut)}
      .dg .box{stroke-width:2}
      .dg .rose{fill:var(--dg-rose-bg,#ffe4e6);stroke:var(--dg-rose-br,#be123c)}
      .dg .blue{fill:var(--dg-blue-bg,#dbeafe);stroke:var(--dg-blue-br,#1d4ed8)}
      .dg .i-rose{fill:var(--dg-rose-br,#be123c)}
      .dg .i-blue{fill:var(--dg-blue-br,#1d4ed8)}
      .dg .e{fill:none;stroke:var(--ln);stroke-width:2;marker-end:url(#qc-a)}
      .dg .rule{stroke:var(--gd);stroke-width:1.5;stroke-dasharray:5 5}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- ======================= lane 1 — MySQL path ======================= -->
  <rect class="box rose" x="24" y="64" width="110" height="88" rx="10"/>
  <rect class="box rose" x="174" y="64" width="200" height="88" rx="10"/>
  <rect class="box rose" x="414" y="64" width="190" height="88" rx="10"/>
  <rect class="box rose" x="644" y="64" width="170" height="88" rx="10"/>
  <rect class="box rose" x="854" y="80" width="162" height="56" rx="28"/>

  <path class="e" d="M140 108 L168 108"/>
  <path class="e" d="M380 108 L408 108"/>
  <path class="e" d="M610 108 L638 108"/>
  <path class="e" d="M820 108 L848 108"/>

  <line class="rule" x1="24" y1="200" x2="1016" y2="200"/>

  <!-- ==================== lane 2 — in-memory path ==================== -->
  <rect class="box blue" x="24" y="258" width="110" height="88" rx="10"/>
  <rect class="box blue" x="174" y="258" width="430" height="88" rx="10"/>
  <rect class="box blue" x="644" y="258" width="170" height="88" rx="10"/>
  <rect class="box blue" x="854" y="274" width="162" height="56" rx="28"/>

  <path class="e" d="M140 302 L168 302"/>
  <path class="e" d="M610 302 L638 302"/>
  <path class="e" d="M820 302 L848 302"/>

  <!-- ============================= text: en ============================= -->
  <g data-i18n="en">
    <text class="t" x="24" y="44">MySQL FULLTEXT — SQL path</text>
    <text x="79" y="115" text-anchor="middle">query</text>
    <text x="274" y="100" text-anchor="middle">InnoDB FULLTEXT</text>
    <text x="274" y="126" text-anchor="middle">through buffer pool</text>
    <text x="509" y="100" text-anchor="middle">candidate lookup</text>
    <text x="509" y="126" text-anchor="middle">and row access</text>
    <text x="729" y="100" text-anchor="middle">SQL sort</text>
    <text x="729" y="126" text-anchor="middle">when requested</text>
    <text class="l i-rose" x="935" y="116" text-anchor="middle">results</text>
    <text class="s" x="24" y="178">The published run had a 99.9989% buffer-pool hit ratio; most reads were served from memory.</text>

    <text class="t" x="24" y="238">MygramDB — in-memory path</text>
    <text x="79" y="309" text-anchor="middle">query</text>
    <text x="389" y="294" text-anchor="middle">delta + Roaring posting lists in RAM</text>
    <text class="s" x="389" y="320" text-anchor="middle">adaptive representation by density</text>
    <text x="729" y="294" text-anchor="middle">intersect</text>
    <text x="729" y="320" text-anchor="middle">and verify</text>
    <text class="l i-blue" x="935" y="310" text-anchor="middle">results</text>
    <text class="s" x="24" y="372">The published run disabled MygramDB's query cache; index data stayed in memory.</text>

    <text class="s" x="520" y="410" text-anchor="middle">See the benchmark for latency by query and the full measurement conditions.</text>
  </g>

  <!-- ============================= text: ja ============================= -->
  <g data-i18n="ja">
    <text class="t" x="24" y="44">MySQL FULLTEXT — SQL 経路</text>
    <text x="79" y="115" text-anchor="middle">クエリ</text>
    <text x="274" y="100" text-anchor="middle">InnoDB FULLTEXT</text>
    <text x="274" y="126" text-anchor="middle">バッファプール経由</text>
    <text x="509" y="100" text-anchor="middle">候補と行を</text>
    <text x="509" y="126" text-anchor="middle">取得</text>
    <text x="729" y="100" text-anchor="middle">必要に応じて</text>
    <text x="729" y="126" text-anchor="middle">SQL ソート</text>
    <text class="l i-rose" x="935" y="116" text-anchor="middle">結果</text>
    <text class="s" x="24" y="178">公開計測のバッファプールヒット率は 99.9989%。ほとんどの読み取りはメモリから処理されました。</text>

    <text class="t" x="24" y="238">MygramDB — インメモリ経路</text>
    <text x="79" y="309" text-anchor="middle">クエリ</text>
    <text x="389" y="294" text-anchor="middle">delta + Roaring ポスティングリストを RAM に保持</text>
    <text class="s" x="389" y="320" text-anchor="middle">密度に応じて表現を切り替え</text>
    <text x="729" y="294" text-anchor="middle">交差と</text>
    <text x="729" y="320" text-anchor="middle">必要な照合</text>
    <text class="l i-blue" x="935" y="310" text-anchor="middle">結果</text>
    <text class="s" x="24" y="372">公開計測では MygramDB のクエリキャッシュを無効化し、インデックスはメモリに保持しました。</text>

    <text class="s" x="520" y="410" text-anchor="middle">クエリごとのレイテンシと計測条件はベンチマークをご覧ください。</text>
  </g>
</svg>
