<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 960 380" role="img">
  <title>MySQL FULLTEXT and MygramDB query paths</title>
  <defs>
    <marker id="qc-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="qc-b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <style>
      .dg text{font-family:'IBM Plex Sans','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;font-size:10.5px;fill:var(--dg-ink,#1f2328)}
      .dg .h{font-size:12.5px;font-weight:500}
      .dg .lbl{font-size:11px;fill:var(--dg-muted,#6e7781);letter-spacing:.06em}
      .dg .s{font-size:10.5px;fill:var(--dg-muted,#6e7781)}
      .dg .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;fill:var(--dg-accent,#8a6a1f)}
      .dg .grp{fill:var(--dg-group,#edeae4)}
      .dg .chip{fill:var(--dg-chip,#fff);stroke:var(--dg-chip-br,#d7d4cd)}
      .dg .card{fill:var(--dg-chip,#fff);stroke:var(--dg-accent,#8a6a1f)}
      .dg .alt{fill:var(--dg-chip,#fff);stroke:var(--dg-accent-2,#3f6b8a)}
      .dg .seam{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-dasharray:6 5}
      .dg .rule{fill:none;stroke:var(--dg-seam,#b8b4ac);stroke-width:1}
      .dg .ln{fill:none;stroke:var(--dg-accent,#8a6a1f);stroke-width:1.4}
      .dg .ln2{fill:none;stroke:var(--dg-accent-2,#3f6b8a);stroke-width:1.4}
      .dg .dash{stroke-dasharray:5 4}
      .dg .ah{fill:var(--dg-accent,#8a6a1f)}
      .dg .ah2{fill:var(--dg-accent-2,#3f6b8a)}
      .dg .fill1{fill:var(--dg-accent,#8a6a1f);opacity:.16}
      .dg .fill2{fill:var(--dg-accent-2,#3f6b8a);opacity:.16}
      .dg .warn{fill:none;stroke:var(--dg-warn,#a3401f);stroke-width:1.6}
      .dg .warnt{fill:var(--dg-warn,#a3401f)}
      .dg [data-i18n]{display:none}
      .dg [data-i18n="en"]{display:inline}
    </style>
  </defs>

  <!-- shapes -->
  <rect class="grp" x="24" y="24" width="912" height="140" rx="8"/>
  <rect class="alt" x="40" y="64" width="96" height="60" rx="5"/>
  <rect class="alt" x="168" y="64" width="164" height="60" rx="5"/>
  <rect class="alt" x="364" y="64" width="164" height="60" rx="5"/>
  <rect class="alt" x="560" y="64" width="164" height="60" rx="5"/>
  <rect class="alt" x="756" y="64" width="164" height="60" rx="5"/>
  <path class="ln2" d="M 138 94 H 166" marker-end="url(#qc-b)"/>
  <path class="ln2" d="M 334 94 H 362" marker-end="url(#qc-b)"/>
  <path class="ln2" d="M 530 94 H 558" marker-end="url(#qc-b)"/>
  <path class="ln2" d="M 726 94 H 754" marker-end="url(#qc-b)"/>
  <rect class="grp" x="24" y="188" width="912" height="140" rx="8"/>
  <rect class="card" x="40" y="228" width="96" height="60" rx="5"/>
  <rect class="card" x="168" y="228" width="360" height="60" rx="5"/>
  <rect class="card" x="560" y="228" width="164" height="60" rx="5"/>
  <rect class="card" x="756" y="228" width="164" height="60" rx="5"/>
  <path class="ln" d="M 138 258 H 166" marker-end="url(#qc-a)"/>
  <path class="ln" d="M 530 258 H 558" marker-end="url(#qc-a)"/>
  <path class="ln" d="M 726 258 H 754" marker-end="url(#qc-a)"/>

  <!-- text: en -->
  <g data-i18n="en">
    <text class="lbl" x="40" y="46">MYSQL FULLTEXT — SQL PATH</text>
    <text x="88" y="98" text-anchor="middle">query</text>
    <text x="250" y="90" text-anchor="middle">InnoDB FULLTEXT</text>
    <text x="250" y="106" text-anchor="middle">through buffer pool</text>
    <text x="446" y="90" text-anchor="middle">candidate lookup</text>
    <text x="446" y="106" text-anchor="middle">and row access</text>
    <text x="642" y="90" text-anchor="middle">SQL sort</text>
    <text x="642" y="106" text-anchor="middle">when requested</text>
    <text x="838" y="98" text-anchor="middle">results</text>
    <text class="s" x="40" y="148">The published run had a 99.9989% buffer-pool hit ratio; most reads were served from memory.</text>

    <text class="lbl" x="40" y="210">MYGRAMDB — IN-MEMORY PATH</text>
    <text x="88" y="262" text-anchor="middle">query</text>
    <text x="348" y="254" text-anchor="middle">delta + Roaring posting lists in RAM</text>
    <text class="s" x="348" y="270" text-anchor="middle">adaptive representation by density</text>
    <text x="642" y="254" text-anchor="middle">intersect</text>
    <text x="642" y="270" text-anchor="middle">and verify</text>
    <text x="838" y="262" text-anchor="middle">results</text>
    <text class="s" x="40" y="312">The published run disabled MygramDB's query cache; index data stayed in memory.</text>

    <text class="s" x="480" y="356" text-anchor="middle">See the benchmark for latency by query and the full measurement conditions.</text>
  </g>

  <!-- text: ja -->
  <g data-i18n="ja">
    <text class="lbl" x="40" y="46">MYSQL FULLTEXT — SQL 経路</text>
    <text x="88" y="98" text-anchor="middle">クエリ</text>
    <text x="250" y="90" text-anchor="middle">InnoDB FULLTEXT</text>
    <text x="250" y="106" text-anchor="middle">バッファプール経由</text>
    <text x="446" y="90" text-anchor="middle">候補と行を</text>
    <text x="446" y="106" text-anchor="middle">取得</text>
    <text x="642" y="90" text-anchor="middle">必要に応じて</text>
    <text x="642" y="106" text-anchor="middle">SQL ソート</text>
    <text x="838" y="98" text-anchor="middle">結果</text>
    <text class="s" x="40" y="148">公開計測のバッファプールヒット率は 99.9989%。ほとんどの読み取りはメモリから処理されました。</text>

    <text class="lbl" x="40" y="210">MYGRAMDB — インメモリ経路</text>
    <text x="88" y="262" text-anchor="middle">クエリ</text>
    <text x="348" y="254" text-anchor="middle">delta + Roaring ポスティングリストを RAM に保持</text>
    <text class="s" x="348" y="270" text-anchor="middle">密度に応じて表現を切り替え</text>
    <text x="642" y="254" text-anchor="middle">交差と</text>
    <text x="642" y="270" text-anchor="middle">必要な照合</text>
    <text x="838" y="262" text-anchor="middle">結果</text>
    <text class="s" x="40" y="312">公開計測では MygramDB のクエリキャッシュを無効化し、インデックスはメモリに保持しました。</text>

    <text class="s" x="480" y="356" text-anchor="middle">クエリごとのレイテンシと計測条件はベンチマークをご覧ください。</text>
  </g>
</svg>
